                      {EXPERT_SCALE.map(([v,l])=>(
                        <span key={v} style={{fontSize:'9px',color:'#607EAA',background:'#080C18',borderRadius:'3px',padding:'2px 6px',whiteSpace:'nowrap',cursor:'pointer'}} onClick={()=>set('expertRating',v)}>{v} {l}</span>
                      ))}
                    </div>
                    <div style={{marginTop:'10px'}}>
                      <input value={form.expertSource||''} onChange={e=>set('expertSource',e.target.value)} placeholder="Source — e.g. Wine Spectator, Robert Parker" style={{width:'100%'}}/>
                    </div>
                    <button onClick={()=>{set('expertRating',null);set('expertSource','');}} style={{marginTop:'8px',background:'none',border:'none',color:'#94816A',fontSize:'11px',padding:0}}>Remove expert rating</button>
                  </>) : <Btn onClick={()=>set('expertRating',88)}>Add expert rating</Btn>}
                </div>
              </div>
            </Box>
            <FRow><FField label="Date Tasted"><input type="date" value={form.reviewDate} onChange={e=>set('reviewDate',e.target.value)}/></FField></FRow>
            <FField label="Review / Notes"><textarea value={form.review} onChange={e=>set('review',e.target.value)} rows="4" placeholder="Your overall thoughts…"/></FField>
            <Box title="Tasting Notes">
              <div style={{display:'flex',flexDirection:'column',gap:'11px'}}>
                {[['nose','Nose','What do you smell?'],['palate','Palate','What do you taste?'],['finish','Finish','How does it end?']].map(([k,l,p])=>(
                  <FField key={k} label={l}><textarea value={form.tastingNotes[k]} onChange={e=>setNote(k,e.target.value)} rows="2" placeholder={p}/></FField>
                ))}
              </div>
            </Box>
          </div>)}

          <div style={{display:'flex',gap:'10px',marginTop:'22px'}}>
            <Btn onClick={save} variant="primary" style={{padding:'11px 26px',fontSize:'13px'}}>{isEdit?'Save Changes':'Add Drink'}</Btn>
            <Btn onClick={onCancel} style={{padding:'11px 18px',fontSize:'13px'}}>Cancel</Btn>
          </div>
        </div>
      </div>);
    }

    // ─── Tastings View ─────────────────────────────────────────────────────
    // Shows all drinks that have been rated, reviewed, or finished.
    // Tasting notes and reviews are shared across all bottles of the same drink.
    function TastingsView({ drinks, onEdit, onSelect }) {
      const [typeFilter, setTypeFilter] = useState('all');
      const [stockFilter, setStockFilter] = useState('all'); // all / in-stock / finished
      const [query, setQuery] = useState('');
      const [sortBy,  setSortBy]  = useState('rating');
      const [sortDir, setSortDir] = useState('desc');
      const locations = useLocations();

      // Show drinks that have been tasted in some way
      const tasted = drinks.filter(hasTasted);
      const filtered = tasted.filter(d => {
        if (typeFilter !== 'all' && d.type !== typeFilter) return false;
        if (stockFilter === 'in-stock'  && !isInCellar(d)) return false;
        if (stockFilter === 'finished'  && isInCellar(d))  return false;
        if (query) { const q=query.toLowerCase(); return [d.name,d.producer,d.region,d.whiskyRegion,d.grape,d.appellation,d.wineColor,d.whiskyStyle,d.year?.toString(),d.ageStatement?.toString()].some(s=>s?.toLowerCase().includes(q)); }
        return true;
      });
      const sorted = sortDrinks(filtered, sortBy, sortDir, locations, 'personal');

      return (<div style={{display:'flex',height:'100%',overflow:'hidden'}}>
        <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
          <div style={{padding:'12px 16px 8px',background:'#0A0604',borderBottom:'1px solid #160E08',flexShrink:0}}>
            <div style={{display:'flex',gap:'8px',flexWrap:'wrap',alignItems:'center',marginBottom:'8px'}}>
              <input type="text" placeholder="Search…" value={query} onChange={e=>setQuery(e.target.value)} style={{flex:1,minWidth:'130px'}}/>
              <div style={{display:'flex',gap:'5px'}}>
                {[['all','All'],['wine','Wine 🍷'],['whisky','Whisky 🥃']].map(([v,l])=>(
                  <button key={v} onClick={()=>setTypeFilter(v)} style={{padding:'7px 12px',borderRadius:'20px',fontSize:'12px',whiteSpace:'nowrap',border:typeFilter===v?'1px solid #C8922A':'1px solid #1E1610',background:typeFilter===v?'#1C1208':'transparent',color:typeFilter===v?'#C8922A':'#9C856E',fontWeight:typeFilter===v?'600':'400'}}>{l}</button>
                ))}
              </div>
            </div>
            <div style={{display:'flex',gap:'5px',flexWrap:'wrap',alignItems:'center'}}>
              {[['all','All tastings'],['in-stock','Still in cellar'],['finished','Finished']].map(([v,l])=>(
                <button key={v} onClick={()=>setStockFilter(v)} style={{padding:'5px 11px',borderRadius:'14px',fontSize:'11px',whiteSpace:'nowrap',border:stockFilter===v?'1px solid #C8922A':'1px solid #1E1610',background:stockFilter===v?'#1C1208':'transparent',color:stockFilter===v?'#C8922A':'#9C856E',fontWeight:stockFilter===v?'600':'400'}}>{l}</button>
              ))}
              <div style={{marginLeft:'auto',display:'flex',gap:'4px',alignItems:'center'}}>
                <SortBar sortBy={sortBy} sortDir={sortDir} typeFilter={typeFilter} onChange={(k,d)=>{setSortBy(k);setSortDir(d);}}/>
              </div>
            </div>
          </div>

          <div style={{flex:1,overflow:'auto',padding:'14px 16px'}}>
            {sorted.length === 0 ? (
              <div style={{textAlign:'center',padding:'60px 20px',color:'#94816A'}}>
                <div style={{fontFamily:"'Playfair Display', serif",fontSize:'18px',color:'#9E8768',marginBottom:'6px'}}>{tasted.length===0?'No tastings yet':'Nothing matches'}</div>
                <div style={{fontSize:'12px'}}>{tasted.length===0?'Rate a drink or mark one as finished to see it here':'Try adjusting your filters'}</div>
              </div>
            ) : (
              <div style={{display:'flex',flexDirection:'column',gap:'10px',maxWidth:'680px'}}>
                {(()=>{const rankMap=new Map(sorted.filter(x=>x.rating!=null).map((d,i)=>[d.id,i+1]));return sorted.map(d=><TastingCard key={d.id} drink={d} rank={rankMap.get(d.id)??null} onEdit={onEdit} onSelect={onSelect}/>);})()}
              </div>
            )}
          </div>
        </div>
      </div>);
    }

    function TastingCard({ drink, rank, onEdit, onSelect }) {
      const [open, setOpen] = useState(false);
      const locName = useLocName();
      const stock   = inStockEntries(drink);
      const total   = stock.reduce((s,e)=>s+e.quantity, 0);
      const hasNotes = hasTastingNotes(drink);
      const top3 = rank && rank <= 3;

      return (<div style={{background:'#110B09',border:`1px solid ${top3?'#2A1A08':'#160E08'}`,borderRadius:'10px',overflow:'hidden'}}>
        <div onClick={()=>setOpen(!open)} style={{padding:'14px 16px',display:'flex',alignItems:'center',gap:'12px',cursor:'pointer'}}>
          {/* Rank */}
          <div style={{width:'26px',flexShrink:0,textAlign:'center',fontFamily:"'Playfair Display', serif",fontSize:'15px',fontWeight:'700',color:top3?'#C8922A':'#97846D'}}>
            {rank || '—'}
          </div>
          <Bottle drink={drink} size={34}/>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontFamily:"'Playfair Display', serif",fontSize:'14px',fontWeight:'600',color:'#E8DCC8',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{drink.name}</div>
            <div style={{fontSize:'11px',color:'#94816A',textTransform:'capitalize',marginTop:'2px'}}>
              {drink.type==='wine' ? `${drink.wineColor||'wine'}${drink.isNV?' NV':drink.year?` ${drink.year}`:''} · ${drink.region||''}` : `${drink.whiskyStyle||'whisky'}${drink.isNAS?' NAS':drink.ageStatement?` ${drink.ageStatement}yr`:''} · ${drink.whiskyRegion||''}`}
            </div>
            {/* Stock status badge */}
            <div style={{marginTop:'4px',display:'flex',gap:'6px',flexWrap:'wrap'}}>
              {total > 0 ? (
                <span style={{fontSize:'10px',color:'#8DAB60',background:'#2A3A1A',borderRadius:'4px',padding:'1px 6px'}}>{total} in cellar</span>
              ) : (drink.stock||[]).some(s=>s.status==='finished') ? (
                <span style={{fontSize:'10px',color:'#9A8060',background:'#2A1E16',borderRadius:'4px',padding:'1px 6px'}}>Finished</span>
              ) : (
                <span style={{fontSize:'10px',color:'#A3886E'}}>Tasted only</span>
              )}
            </div>
          </div>
          {drink.rating != null ? (
            <div style={{textAlign:'right',flexShrink:0}}>

    // ─── App ───────────────────────────────────────────────────────────────
    function App({ user, onSignOut, onUserChange }) {
      const [drinks,    setDrinks]    = useState([]);
      // `drinksRef` is always the newest list (updated at once, not at the next render), so queued saves start from the latest copy.
      const drinksRef = useRef([]);
      const saveChain = useRef(Promise.resolve());
      const pendingScale = useRef(null);
      const flushRef = useRef(() => {});
      function setDrinksNow(u) { const next = typeof u === 'function' ? u(drinksRef.current) : u; drinksRef.current = next; setDrinks(next); }
      // One save at a time: a task starts only when the one before it has finished (whether it worked or not).
      function enqueue(task) { const run = saveChain.current.then(task, task); saveChain.current = run.catch(() => {}); return run; }
      const [locations, setLocations] = useState(DEFAULT_LOCATIONS);
      const [scale,     setScale]     = useState(DEFAULT_SCALE);
      const [view,      setView]      = useState('cellar');
      const [editing,   setEditing]   = useState(null);
      const [selected,  setSelected]  = useState(null);
      const [loading,   setLoading]   = useState(true);
      const [appError,  setAppError]  = useState(null);
      const [loadFailed, setLoadFailed] = useState(null);
      const conflictId = useRef(null);
      const settingsVer   = useRef(0);
      const settingsChain = useRef(Promise.resolve());
      const scaleTimer    = useRef(null);

      function applyCellar({ drinks, settings }) {
        setDrinksNow(drinks);
        settingsVer.current = settings.version;
        // System locations always come fresh from defaults — they can't be user-edited.
        const systemLocs = DEFAULT_LOCATIONS.filter(l => l.system);
        setLocations(settings.locations ? [...settings.locations.filter(l => !l.system), ...systemLocs] : DEFAULT_LOCATIONS);
        setScale(settings.scale || DEFAULT_SCALE);
      }
      async function reload() {
        try { applyCellar(await store.load()); setSelected(null); }
        catch (e) { setAppError(e.message || 'Could not load your cellar.'); }
      }
      // 409 = this item was changed elsewhere (another tab or device): reload so the next try is current.
      async function fail(e, fallback) {
        if (e instanceof ApiError && e.status === 409) {
          setAppError('This was changed on another device or tab. Your cellar has been reloaded, please try again.');
          setEditing(null); setView('cellar');
          await reload();
        } else setAppError(e instanceof ApiError && (e.code === 'network' || ERROR_TEXT[e.code]) ? e.message : fallback);
      }

      async function openCellar() {
        setLoading(true); setLoadFailed(null);
        try { applyCellar(await store.load()); }
        catch (e) { setLoadFailed(e.message || 'Could not load your cellar.'); }
        setLoading(false);
      }
      useEffect(() => { openCellar(); }, []);

      // Saves one drink and puts the server's new version on it. Returns the saved drink or null.
      // keepForm: the save comes from the Add/Edit form. On a 409 the form stays open with what was typed; the cellar is reloaded, and
      // pressing Save again then replaces the other change (the held copy is newer, so its version is used) while Cancel keeps it.
      async function persistNow(updated, keepForm) {
        // Only this tab's own earlier save (a double click), or the reload after a 409 on the form, can make the held copy newer than the form's copy.
        const cur = drinksRef.current.find(d => d.id === updated.id);
        let toSave = cur && cur._v != null && cur._v > (updated._v ?? 0) ? { ...updated, _v: cur._v } : updated;
        if (!cur && conflictId.current === updated.id) toSave = { ...updated, _v: null };   // deleted elsewhere: Save adds it again
        try {
          const saved = await store.upsert(toSave);
          setDrinksNow(prev => prev.some(d => d.id === saved.id) ? prev.map(d => d.id === saved.id ? saved : d) : [...prev, saved]);
          if (conflictId.current === saved.id) { conflictId.current = null; setAppError(m => (m && m.indexOf('This drink was changed') === 0 ? null : m)); }
          return saved;
        } catch (e) {
          if (keepForm && e instanceof ApiError && e.status === 409) {
            conflictId.current = updated.id;
            await reload();
            setAppError('This drink was changed on another device or tab. Your changes are still in the form. Press Save again to replace the other change with yours, or Cancel to keep the other change.');
            return null;
          }
          await fail(e, 'Failed to save. Check your connection and try again.'); return null;
        }
      }
      const persistDrink = (updated, keepForm) => enqueue(() => persistNow(updated, keepForm));
      // Changes one drink from its LATEST copy (so two quick changes both land); `make` returns the new drink or null for nothing to do.
      const changeDrink = (drinkId, make) => enqueue(async () => {
        const drink = drinksRef.current.find(d => d.id === drinkId);
        const updated = drink && make(drink);
        return updated ? persistNow(updated) : null;
      });
      async function saveDrink(drink) {
        const saved = await persistDrink(drink, true);
        if (saved) { setEditing(null); setView('cellar'); }
      }
      const removeDrink = id => enqueue(async () => {
        const d = drinksRef.current.find(x => x.id === id);
        try {
          await store.remove(d || { id });
          setDrinksNow(prev => prev.filter(x => x.id !== id));
          setSelected(null);
        } catch (e) { await fail(e, 'Failed to delete drink. Check your connection and try again.'); }
      });

      // Stock operations — update the drink's stock[] array
      async function addStock(drinkId, entry) {
        const saved = await changeDrink(drinkId, drink => ({...drink, stock:[...(drink.stock||[]), entry]}));
        if (saved) setSelected(saved);
      }
      async function finishStock(drinkId, stockId, qty) {
        const saved = await changeDrink(drinkId, drink => {
        const entry = (drink.stock||[]).find(s=>s.id===stockId);
        if (!entry) return null;
        const finishQty = Math.min(qty||entry.quantity, entry.quantity);
        let newStock;
        if (finishQty >= entry.quantity) {
          // Finish all — mark entry as finished
          newStock = drink.stock.map(s=>s.id===stockId?{...s,status:'finished',dateFinished:today()}:s);
        } else {
          // Finish some — reduce quantity, add a finished record for the consumed bottles
          newStock = [
            ...drink.stock.map(s=>s.id===stockId?{...s,quantity:s.quantity-finishQty}:s),
            { id:uid(), location:entry.location, sublocation:entry.sublocation,
              position:entry.position, quantity:finishQty, dateAdded:entry.dateAdded,
              status:'finished', dateFinished:today() },
          ];
        }
        return {...drink, stock:newStock};
        });
        if (saved) setSelected(saved);
      }
      async function removeStock(drinkId, stockId) {
        const saved = await changeDrink(drinkId, drink => ({...drink, stock:(drink.stock||[]).filter(s=>s.id!==stockId)}));
        if (saved) setSelected(saved);
      }
      // Move: supports partial quantity.
      // Moving all  → updates entry in-place (removes from Unassigned correctly).
      // Moving some → reduces source qty, creates new entry at destination.
      async function moveStock(drinkId, stockId, qty, patch) {
        const saved = await changeDrink(drinkId, drink => {
        const entry = (drink.stock||[]).find(s=>s.id===stockId);
        if (!entry) return null;
        const moveQty = Math.min(qty||entry.quantity, entry.quantity);
        let newStock;
        if (moveQty >= entry.quantity) {
          // Move all — update in-place
          newStock = drink.stock.map(s=>s.id===stockId?{...s,...patch}:s);
        } else {
          // Move some — reduce source, add new entry at destination
          newStock = [
            ...drink.stock.map(s=>s.id===stockId?{...s,quantity:s.quantity-moveQty}:s),
            { id:uid(), ...patch, quantity:moveQty,
              dateAdded:today(), status:'in_stock', dateFinished:null },
          ];
        }
        return {...drink, stock:newStock};
        });
        if (saved) setSelected(saved);
      }

      // Settings saves go through one queue so each uses the version the last one returned.
      // A network error or a 5xx is retried after 5, 15 and 60 seconds (the screen already shows the change, so say it is not saved yet);
      // a 4xx (including a 409) is never retried.
      function saveSettings(patch, opts) {
        settingsChain.current = settingsChain.current.then(async () => {
          const waits = [5000, 15000, 60000];
          for (let attempt = 0; ; attempt++) {
            try {
              settingsVer.current = await store.saveSettings(patch, settingsVer.current, opts);
              setAppError(m => (m && m.indexOf('Settings are not saved yet') === 0 ? null : m));
              return;
            } catch (e) {
              const retryable = e instanceof ApiError && (e.status === 0 || e.status >= 500);
              if (!retryable || (opts && opts.keepalive)) { await fail(e, 'Failed to save settings. Check your connection.'); return; }
              if (attempt >= waits.length) { setAppError('Settings were not saved. Check your connection and make the change again.'); return; }
              setAppError('Settings are not saved yet. Trying again...');
              await new Promise(r => setTimeout(r, waits[attempt]));
            }
          }
        });
        return settingsChain.current;
      }
      function updateLocations(nl) { setLocations(nl); saveSettings({ locations: nl.filter(l => !l.system) }); }
      function updateScale(ns) {
        setScale(ns);
        clearTimeout(scaleTimer.current);
        pendingScale.current = ns;
        scaleTimer.current = setTimeout(() => { pendingScale.current = null; saveSettings({ scale: ns }); }, 700);   // typing in the chips saves once, not per keystroke
      }
      // A scale edit still waiting for its timer is saved at once when the page is hidden or closed.
      flushRef.current = () => {
        if (pendingScale.current) { const ns = pendingScale.current; pendingScale.current = null; clearTimeout(scaleTimer.current); saveSettings({ scale: ns }, { keepalive: true }); }
      };
      useEffect(() => {
        const onHide = () => { if (document.visibilityState === 'hidden') flushRef.current(); };
        const onGone = () => flushRef.current();
        document.addEventListener('visibilitychange', onHide); window.addEventListener('pagehide', onGone);
        return () => { document.removeEventListener('visibilitychange', onHide); window.removeEventListener('pagehide', onGone); };
      }, []);
      // Batch-save multiple drinks (used when migrating orphaned stock to Unassigned)
      // Goes through the same queue as every other drink save, and uses the newest version of each drink this tab holds.
      function saveDrinks(drinkList) {
        return enqueue(async () => {
          try {
            const list = drinkList.map(d => { const cur = drinksRef.current.find(x => x.id === d.id); return cur && cur._v != null && cur._v > (d._v ?? 0) ? { ...d, _v: cur._v } : d; });
            const saved = await store.upsertMany(list);
            const map = new Map(saved.map(d => [d.id, d]));
            setDrinksNow(prev => prev.map(d => map.get(d.id) || d));
          } catch (e) { await fail(e, 'Failed to move bottles. Check your connection.'); throw e; }
        });
      }
      // The bulk operations run on the server in one atomic step; then we reload.
      async function handleDangerOp(id) {
        try {
          if      (id === 'unassign')     await store.op('unassign');
          else if (id === 'clearstock')   await store.op('clearstock');
          else if (id === 'clearall')     await store.op('clearstock', { locations: [] });
          else if (id === 'deletedrinks') await store.op('delete-drinks');
          else if (id === 'factory')      await store.op('delete-drinks', { locations: [] });
          else if (id === 'demo')         await store.op('replace-all', { drinks: SAMPLE_DRINKS.map(toApiDrink), locations: DEFAULT_LOCATIONS.filter(l => !l.system) });
          await reload();
          setView('cellar');
        } catch(e) { await fail(e, 'Operation failed. Please try again.'); }
      }
      async function renameUser(name) {
        try { const r = await api('PATCH', '/me', { name, version: user.version }); onUserChange(r.user); }
        catch (e) { throw new Error(e.status === 409 ? 'Your profile changed elsewhere. Sign in again.' : (e.message || 'Could not save')); }
      }
      // Downloads everything in the same shape scripts/import-local.mjs reads (drinks with prices in dollars, locations, rating scale).
      async function exportData() {
        const r = await api('GET', '/cellar');
        const data = { app: 'My Cellar', exportedAt: new Date().toISOString(),
          drinks: r.drinks.map(fromApiDrink).map(({ _v, ...d }) => d),
          locations: (r.settings.locations || []), scale: r.settings.scale || null };
        const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
        const a = document.createElement('a'); a.href = url; a.download = 'my-cellar-' + today() + '.json';
        document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
      }
      async function deleteAccount() {
        try { await api('DELETE', '/me'); session.clear(); window.location.reload(); }
        catch (e) { setAppError('Could not delete the account. Try again.'); }
      }
      function navTo(v)     { setView(v); setSelected(null); setEditing(null); }
      function startAdd()   { setEditing(null); setView('add'); setSelected(null); }
      function startEdit(d) { setEditing(d);    setView('add'); setSelected(null); }

      const cellarDrinks = useMemo(() => drinks.filter(isInCellar), [drinks]);
      const totalValue   = useMemo(() => drinks.reduce((s,d) => s + inStockEntries(d).reduce((ss,e)=>ss+(d.price||0)*e.quantity,0), 0), [drinks]);
      // Pre-computed set of occupied rack positions (memoised — only recalculates when drinks change)
      const occupiedPositions = useMemo(() => new Set(
        drinks.flatMap(d => d.stock||[])
          .filter(s => s.status==='in_stock' && s.position!=null)
          .map(s => `${s.location}:${s.sublocation}:${s.position}`)
      ), [drinks]);

      if (loading) return (
        <div style={{display:'flex',height:'100%',alignItems:'center',justifyContent:'center',background:'#0C0806',flexDirection:'column',gap:'18px'}}>
          <div style={{width:'36px',height:'36px',border:'3px solid #1C1208',borderTopColor:'#C8922A',borderRadius:'50%',animation:'cellar-spin 0.8s linear infinite'}}/>
          <div style={{color:'#C8922A',fontFamily:"'Playfair Display', serif",fontSize:'18px'}}>Opening your cellar…</div>
        </div>
      );

      if (loadFailed) return (
        <div style={{display:'flex',height:'100%',alignItems:'center',justifyContent:'center',background:'#0C0806',padding:'24px'}}>
          <div style={{maxWidth:'340px',width:'100%',textAlign:'center'}}>
            <div style={{fontFamily:"'Playfair Display', serif",fontSize:'20px',color:'#C8922A',marginBottom:'10px'}}>Could not open your cellar</div>
            <p style={{color:'#A68E7A',fontSize:'13px',lineHeight:'1.6',marginBottom:'18px'}}>{loadFailed} Your data is safe; it just could not be loaded.</p>
            <div style={{display:'flex',gap:'10px',justifyContent:'center'}}>
              <Btn onClick={openCellar} variant="primary" style={{padding:'9px 20px',fontSize:'13px'}}>Try again</Btn>
              <Btn onClick={onSignOut} style={{padding:'9px 20px',fontSize:'13px'}}>Sign out</Btn>
            </div>
          </div>
        </div>
      );
      const sp = { drinks, selected, occupiedPositions, onSelect:setSelected, onEdit:startEdit, onDelete:removeDrink, onAddStock:addStock, onFinishStock:finishStock, onRemoveStock:removeStock, onMoveStock:moveStock };

      return (<ScaleCtx.Provider value={scale}><LocCtx.Provider value={locations}>
        <div style={{display:'flex',flexDirection:'column',height:'100%',background:'#0C0806',color:'#F0E6D3',overflow:'hidden'}}>
          <MobileHeader drinkCount={cellarDrinks.length} totalBottles={cellarDrinks.reduce((s,d)=>s+inStockEntries(d).reduce((ss,e)=>ss+e.quantity,0),0)} onNav={navTo}/>
          <div style={{display:'flex',flex:1,overflow:'hidden'}}>
            <Sidebar view={view} onNav={navTo} onAdd={startAdd} drinks={drinks} user={user}/>
            <main style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
              {view==='cellar'    && <CellarView   {...sp}/>}
              {view==='map'       && <MapView      {...sp} onManageLocations={()=>setView('locations')}/>}
              {view==='tastings'  && <TastingsView drinks={drinks} onEdit={startEdit} onSelect={d=>{setSelected(d);setView('cellar');}}/>}
              {view==='locations' && <ManageLocationsView onClose={()=>setView('map')} drinks={drinks} onUpdateLocations={updateLocations} onSaveDrinks={saveDrinks}/>}
              {view==='add'       && <AddEditView  drink={editing} onSave={saveDrink} onCancel={()=>{setEditing(null);navTo('cellar');}}/>}
              {view==='settings'  && <SettingsView onClose={()=>navTo('cellar')} onDangerOp={handleDangerOp} onUpdateScale={updateScale} user={user} onRename={renameUser} onSignOut={onSignOut} onDeleteAccount={deleteAccount} onExport={exportData}/>}
            </main>
          </div>
          <BottomNav view={view} onNav={navTo} onAdd={startAdd}/>
          {appError && <ErrorToast message={appError} onDismiss={()=>setAppError(null)}/>}
        </div>
      </LocCtx.Provider></ScaleCtx.Provider>);
    }

    class ErrorBoundary extends React.Component {
      constructor(p) { super(p); this.state = { err: null }; }
      componentDidCatch(e) { this.setState({ err: e.message + '\n' + e.stack }); }
      render() {
        if (this.state.err) return (
          <div style={{background:'#0C0806',color:'#E88080',padding:'20px',height:'100vh',overflow:'auto',fontFamily:'monospace'}}>
            <div style={{color:'#C8922A',fontFamily:"'Playfair Display',serif",fontSize:'18px',marginBottom:'12px'}}>Something went wrong</div>
            <pre style={{fontSize:'11px',whiteSpace:'pre-wrap',lineHeight:1.5}}>{this.state.err}</pre>
          </div>
        );
        return this.props.children;
      }
    }

    // ─── Sign-in ──────────────────────────────────────────────────────────
    const SIGNIN_ERRORS = {
      not_invited: "That email address hasn't been invited to this cellar.",
      email_not_verified: 'Google reports that email address as not verified.',
      account_already_linked: 'That email is already linked to a different account.',
      token_expired: 'Sign-in took too long. Please try again.',
      origin_not_allowed: 'This page is not allowed to use the sign-in service.',
      invalid_token: 'Sign-in could not be checked. Please try again.',
      provider_not_configured: 'Sign-in is not available yet.',
    };
    function LoginScreen({ onSignedIn, notice }) {
      const [err, setErr]   = useState(null);
      const [busy, setBusy] = useState(false);
      const btnRef = useRef(null);
      async function exchange(path, idToken, nonce) {
        setBusy(true); setErr(null);
        try { onSignedIn(await api('POST', path, nonce ? { idToken, nonce } : { idToken })); }
        catch (e) { setErr(SIGNIN_ERRORS[e.code] || e.message || 'Sign-in failed.'); setBusy(false); }
      }
      useEffect(() => {
        if (!GOOGLE_CLIENT_ID) return;
        let tries = 0;
        const t = setInterval(() => {
          if (window.google && window.google.accounts && window.google.accounts.id) {
            clearInterval(t);
            window.google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: r => exchange('/auth/google', r.credential) });
            if (btnRef.current) window.google.accounts.id.renderButton(btnRef.current, { theme: 'filled_black', size: 'large', shape: 'pill', text: 'signin_with', width: 260 });
          } else if (++tries > 100) { clearInterval(t); setErr('Google sign-in could not load. An ad blocker or a network filter may be blocking it. Try another browser or network.'); }
        }, 100);
        return () => clearInterval(t);
      }, []);
      // Microsoft (personal accounts) returns an id_token in the URL fragment.
      useEffect(() => {
        if (!MS_CLIENT_ID || !window.location.hash.includes('id_token=')) return;
        const p = new URLSearchParams(window.location.hash.slice(1));
        const tok = p.get('id_token');
        let nonce = null; try { nonce = sessionStorage.getItem('mycellar-ms-nonce'); } catch {}
        window.history.replaceState(null, '', window.location.pathname + window.location.search);
        try {
          const claims = JSON.parse(atob(tok.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
          if (!nonce || claims.nonce !== nonce || p.get('state') !== nonce) { setErr('Sign-in could not be verified. Please try again.'); return; }
        } catch { setErr('Sign-in failed.'); return; }
        exchange('/auth/microsoft', tok, nonce);
      }, []);
      function startMicrosoft() {
        const nonce = uid() + uid();
        try { sessionStorage.setItem('mycellar-ms-nonce', nonce); } catch {}
        window.location.href = 'https://login.microsoftonline.com/consumers/oauth2/v2.0/authorize?' + new URLSearchParams({
          client_id: MS_CLIENT_ID, response_type: 'id_token', redirect_uri: window.location.origin + window.location.pathname,
          response_mode: 'fragment', scope: 'openid profile email', nonce, state: nonce });
      }
      return (
        <div style={{display:'flex',height:'100%',alignItems:'center',justifyContent:'center',background:'#0C0806',padding:'24px'}}>
          <div style={{maxWidth:'340px',width:'100%',textAlign:'center'}}>
            <div style={{fontSize:'44px',marginBottom:'8px'}}>🍾</div>
            <h1 style={{fontFamily:"'Playfair Display', serif",fontSize:'30px',fontWeight:'700',color:'#F0E6D3'}}>My Cellar</h1>
            <p style={{color:'#A3886E',fontSize:'13px',margin:'8px 0 28px',lineHeight:'1.6'}}>Sign in to open your cellar.</p>
            {busy && <div style={{color:'#C8922A',fontSize:'13px',marginBottom:'16px'}}>Signing you in…</div>}
            <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:'12px',opacity:busy?0.4:1,pointerEvents:busy?'none':'auto'}}>
              {GOOGLE_CLIENT_ID && <div ref={btnRef}/>}
              {MS_CLIENT_ID && <Btn onClick={startMicrosoft} style={{width:'260px',padding:'10px 16px',borderRadius:'20px'}}>Sign in with Microsoft</Btn>}
              {!GOOGLE_CLIENT_ID && !MS_CLIENT_ID && <div style={{color:'#AA896B',fontSize:'12px'}}>Sign-in is not set up yet.</div>}
            </div>
            {(err || notice) && <div style={{marginTop:'20px',background:'#2A0808',border:'1px solid #8B2020',color:'#E88080',padding:'10px 14px',borderRadius:'8px',fontSize:'12px',lineHeight:'1.5'}}>{err || notice}</div>}
          </div>
        </div>
      );
    }

    function Root() {
      const [sess, setSess] = useState(() => session.get());
      const [ended, setEnded] = useState(false);
      useEffect(() => { onUnauthorized = () => { session.clear(); setSess(null); setEnded(true); }; }, []);
      // The sign-in reply carries no profile version, so fetch it once for the rename stale-edit check.
      useEffect(() => { if (sess && sess.user.version == null) api('GET', '/me').then(r => userChanged(r.user)).catch(() => {}); }, [sess && sess.token]);
      function signedIn(r) { session.set({ token: r.token, user: r.user }); setEnded(false); setSess(session.get()); }
      async function signOut() { try { await api('POST', '/me/logout', {}); } catch {} session.clear(); setSess(null); }
      function userChanged(u) { const s = { ...sess, user: u }; session.set(s); setSess(s); }
      if (!sess) return <LoginScreen onSignedIn={signedIn} notice={ended ? ERROR_TEXT.unauthorized + ' Anything not saved before that was not kept.' : null}/>;
      return <App key={sess.user.id} user={sess.user} onSignOut={signOut} onUserChange={userChanged}/>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><Root/></ErrorBoundary>);
  </script>
</body>
</html>
