    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    /* Fix Chrome mobile address-bar bug: 100svh = visible area only */
    #root { height: 100vh; height: 100svh; }
    body { background: #0C0806; font-family: 'Inter', system-ui, sans-serif; color: #F0E6D3; }

    /* CSS media queries for layout — reliable everywhere, no JS needed */
    .mob-header  { display: none; }
    .app-sidebar { display: flex; }
    .bot-nav     { display: none; }
    .detail-panel {
      width: 300px; flex-shrink: 0; background: #0A0604;
      border-left: 1px solid #160E08; overflow: auto; padding: 20px;
    }
    .det-close { display: block; } .det-back { display: none; }

    @media (max-width: 767px) {
      .mob-header  { display: flex; }
      .app-sidebar { display: none; }
      .bot-nav     { display: flex; }
      .detail-panel { position: fixed; inset: 0; z-index: 200; width: 100%; border-left: none; overflow: auto; padding: 20px; }

      input, textarea, select { font-size: 16px !important; }   /* below 16px an iPhone zooms in when a field is tapped */

    ::-webkit-scrollbar-track { background: #0C0806; }
    ::-webkit-scrollbar-thumb { background: #2A1E16; border-radius: 4px; }
    input, textarea, select {
      background: #17100D; border: 1px solid #2A1E16; color: #F0E6D3;
      border-radius: 6px; padding: 9px 13px; font-size: 13px;
      font-family: inherit; width: 100%; outline: none; transition: border-color 0.15s;
    }
    input:focus, textarea:focus, select:focus { border-color: #C8922A; }
    select option { background: #17100D; color: #F0E6D3; }
    button { cursor: pointer; font-family: inherit; transition: all 0.15s; }
    input[type="range"] { padding: 0; border: none; background: transparent; accent-color: #C8922A; }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.4); }
    textarea { resize: vertical; }
    @keyframes cellar-spin { to { transform: rotate(360deg); } }

    const ERROR_TEXT = {
      body_too_large: 'That is too much data to send at once. Try a smaller change.',
      invalid: 'Some of that information is not valid, so it was not saved.',
      invalid_json: 'Something went wrong sending that. Please try again.',

      conflict: 'This was changed on another device or tab.',
      forbidden: 'You are not allowed to do that.',
      not_invited: "That email address hasn't been invited to this cellar.",
      email_not_verified: 'Google reports that email address as not verified.',
      account_already_linked: 'That email is already linked to a different account.',
      provider_not_configured: 'Sign-in is not available yet.',
      origin_not_allowed: 'This page is not allowed to use the sign-in service.',
      internal: 'The server had a problem. Please try again in a moment.',
      lookup_limit: "You have used today's lookups. Try again tomorrow, or fill the details in yourself.",
      lookup_unavailable: 'Look up is not available right now. You can fill the details in yourself.',
    };
    class ApiError extends Error {
      constructor(status, code, message) { super(ERROR_TEXT[code] || message || code); this.status = status; this.code = code; }
    }
    const session = {
      get() { try { const r = localStorage.getItem(SESSION_KEY); const s = r ? JSON.parse(r) : null; return s && s.token ? s : null; } catch { return null; } },
      set(s) { try { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); } catch {} },
      clear() { try { localStorage.removeItem(SESSION_KEY); } catch {} },
    };
    let onUnauthorized = () => {};
    async function api(method, path, body, opts) {
      const s = session.get();
      const headers = {};
      if (s) headers.Authorization = 'Bearer ' + s.token;
      if (body !== undefined) headers['Content-Type'] = 'application/json';
      let res;
      try { res = await fetch(API_BASE + path, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined, keepalive: !!(opts && opts.keepalive) }); }
      catch { throw new ApiError(0, 'network', 'Could not reach the server. Check your connection.'); }
      let data = null; try { data = await res.json(); } catch {}
      if (!res.ok) {
        if (res.status === 401 && s) onUnauthorized();
        throw new ApiError(res.status, (data && data.error) || 'error', data && data.message);
      }
      return data;
    }

    // Data model: drinks[] where each drink has embedded stock[]. Money is whole cents on
    // the server (price_cents); the page keeps dollars in `price`, and `_v` is the version
    // the server last gave us (a stale edit is refused with a 409).
    const toCents = p => (p === null || p === undefined || p === '') ? null : Math.round(Number(p) * 100);
    const fromApiDrink = ({ version, price_cents, ...d }) => ({ ...d, price: price_cents == null ? null : price_cents / 100, _v: version });
    const toApiDrink = ({ _v, price, ...d }) => ({ ...d, price_cents: toCents(price) });

    const store = {
      async load() { const r = await api('GET', '/cellar'); return { drinks: r.drinks.map(fromApiDrink), settings: r.settings }; },
      async upsert(d) { const r = await api('PUT', '/drinks/' + encodeURIComponent(d.id), { drink: toApiDrink(d), version: d._v ?? null }); return { ...d, _v: r.version }; },
      // Atomic per request of up to 50 drinks.
      async upsertMany(ds) {
        const out = [];
        for (let i = 0; i < ds.length; i += 50) {
          const chunk = ds.slice(i, i + 50);
          const r = await api('POST', '/drinks/bulk', { items: chunk.map(d => ({ drink: toApiDrink(d), version: d._v ?? null })) });
          const vm = new Map(r.versions.map(v => [v.id, v.version]));
          chunk.forEach(d => out.push({ ...d, _v: vm.get(d.id) }));
        }
        return out;
      },
      async remove(d) { await api('DELETE', '/drinks/' + encodeURIComponent(d.id) + (d._v ? '?version=' + d._v : '')); },
      async saveSettings(patch, version, opts) { const r = await api('PUT', '/settings', { ...patch, version }, opts); return r.version; },
      op(name, body) { return api('POST', '/ops/' + name, body || {}); },
    };

    // ─── Helpers ──────────────────────────────────────────────────────────
    const cap  = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
    const uid  = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };   // the person's own date, not UTC
    const bottleColor = d => {
      if (!d) return '#555';
      return d.type === 'wine' ? (BOTTLE_COLORS.wine[d.wineColor] || '#8B1A35') : (BOTTLE_COLORS.whisky[d.whiskyStyle] || '#C07A2A');
    };
    const inStockEntries = d => (d.stock || []).filter(s => s.status === 'in_stock');
    const hasTastingNotes = d => d.tastingNotes?.nose || d.tastingNotes?.palate || d.tastingNotes?.finish;
    const isInCellar = d => inStockEntries(d).length > 0;
    const hasTasted  = d => d.rating != null || d.review?.trim() || hasTastingNotes(d) || (d.stock||[]).some(s=>s.status==='finished') || (d.stock||[]).length===0;

    function getSortOptions(tf) {
      // Subtype = Colour for wine, Style for whisky. Not shown in 'all' mode.
      if (tf === 'wine')    return [['name','A–Z'],['rating','Rating'],['year','Year'],['subtype','Colour'],['grape','Grape'],['region','Region'],['location','Storage']];
      if (tf === 'whisky') return [['name','A–Z'],['rating','Rating'],['ageStatement','Age'],['subtype','Style'],['location','Storage']];
      return                        [['name','A–Z'],['rating','Rating'],['type','Type'],['location','Storage']];
    }
    function sortDrinks(drinks, sortBy, sortDir, locations, ratingMode) {
      // Direction applied inside each case so we can mix "always-end" and
      // "participates in sort" behaviour per field.
      const dir = sortDir === 'asc' ? 1 : -1;
      return [...drinks].sort((a, b) => {
        switch (sortBy) {
          case 'name': return dir * (a.name||'').localeCompare(b.name||'');
          case 'type': return dir * (a.type||'').localeCompare(b.type||'');
          case 'year': {
            // NV sorts as newest (9999). Not-entered sorts to absolute end.
            const ya = a.isNV ? 9999 : (a.year != null ? a.year : null);
            const yb = b.isNV ? 9999 : (b.year != null ? b.year : null);
            if (ya==null && yb==null) return 0;
            if (ya==null) return 1; if (yb==null) return -1;
            return dir * (ya - yb);
          }
          case 'ageStatement': {
            // NAS sorts as youngest (0). Not-entered sorts to absolute end.
            const aa = a.isNAS ? 0 : (a.ageStatement != null ? a.ageStatement : null);
            const ab = b.isNAS ? 0 : (b.ageStatement != null ? b.ageStatement : null);
            if (aa==null && ab==null) return 0;
            if (aa==null) return 1; if (ab==null) return -1;
            return dir * (aa - ab);
          }
          case 'rating': {
            // Expert mode sorts by expertRating; personal/both sort by personal rating
            const ra = ratingMode==='expert' ? (a.expertRating??0) : (a.rating??0);
            const rb = ratingMode==='expert' ? (b.expertRating??0) : (b.rating??0);
            return dir * (ra - rb);
          }
          case 'subtype': {
            // Blank sorts naturally: first in A–Z (ascending), last in Z–A (descending).
            const va = a.type==='wine' ? (a.wineColor||'') : (a.whiskyStyle||'');
            const vb = b.type==='wine' ? (b.wineColor||'') : (b.whiskyStyle||'');
            return dir * va.localeCompare(vb);
          }
          case 'grape':
            return dir * (a.grape||'').localeCompare(b.grape||'');
          case 'region':
            return dir * (a.region||'').localeCompare(b.region||'');
          case 'location': {
            // Sorts by storage location name + sublocation.
            const sa = inStockEntries(a)[0]; const sb = inStockEntries(b)[0];
            const la = sa ? (locations.find(l=>l.id===sa.location)?.name||'')+(sa.sublocation||'') : '';
            const lb = sb ? (locations.find(l=>l.id===sb.location)?.name||'')+(sb.sublocation||'') : '';
            return dir * la.localeCompare(lb);
          }
          default: return 0;
        }
      });
    }

    // ─── Context ──────────────────────────────────────────────────────────
    const LocCtx     = createContext([]);
    const useLocations = () => useContext(LocCtx);
    const useLocName   = () => { const locs = useLocations(); return id => locs.find(l=>l.id===id)?.name || id; };

    // ─── SVG Bottles ──────────────────────────────────────────────────────
    function WineBottle({ color, size=60 }) {
      // viewBox starts at y=-0.5 to accommodate cork's 0.5px above y=0
      return (<svg width={Math.round(size*.38)} height={size} viewBox="0 -1 38 101" style={{flexShrink:0}}>
        {/* Cork stub — 8px wide (−1px each side), y=−0.5 (0.5px taller upward), h=2.5 */}
        <rect x="15" y="-1" width="8" height="3" rx=".5" fill={color}/>
        {/* Collar — 9px wide (−0.5px each side), covers top 1px of neck */}
        <rect x="14.5" y="1" width="9" height="4" rx=".5" fill={color}/>
        {/* Neck 8px · shoulder CP1 at neck edge · body y=34–83 · base */}
        <path d="M15 4 L15 23 C15 26 9 25 9 34 L9 79 Q9 85 19 85 Q29 85 29 79 L29 34 C29 25 23 26 23 23 L23 4 Z" fill={color}/>
        <rect x="11" y="44" width="16" height="23" fill="white" opacity=".08" rx="1"/>
        <line x1="12" y1="36" x2="12" y2="75" stroke="white" strokeWidth="1" opacity=".1"/>
      </svg>);
    }
    function WhiskeyBottle({ color, size=60 }) {
      // Cap: 1px off top (starts y=1). Neck: 18px (was 23px) → more stout.
      // Everything below neck shifts up 5px. Shoulder roundness preserved.
      // Label: top raised ~10% extra + more pronounced banner arch.
      return (<svg width={Math.round(size*.5)} height={size} viewBox="0 0 48 100" style={{flexShrink:0}}>
        {/* Cap — 1px shorter at top (y=1), bottom corners still curve to neck width */}
        <path d="M18.5 1 L29.5 1 Q30 1 30 1.5 L30 9 Q30 12 29 12 L19 12 Q18 12 18 9 L18 1.5 Q18 1 18.5 1 Z" fill={color}/>
        {/* Neck: top 10px (1px in from cap), bottom 14px (2px wider each side than top)
            Shoulder: CP1 4px below neck for downward start, CP2 high for roundness */}
        <path d="M19 12 C16 18 16 24 17 30 C17 31 6 35 6 42 L9 83 C7 85 8 85 8 86 C8 88 16 88 18 88 L30 88 C32 88 40 88 40 86 C40 85 41 85 39 83 L42 42 C42 35 31 31 31 30 C32 24 32 18 29 12 Z" fill={color}/>
        {/* Label: top y=48 (10% taller), bottom y=75, banner arch at Q24 40 (4px peak) */}
        <path d="M11 48 Q24 40 37 48 L36 75 L12 75 Z" fill="white" opacity=".08"/>
        <line x1="10" y1="44" x2="10" y2="73" stroke="white" strokeWidth="1.5" opacity=".1"/>
      </svg>);
    }
    function Bottle({ drink, size, colorOverride }) {
      const c = colorOverride || bottleColor(drink);
      return drink.type==='wine' ? <WineBottle color={c} size={size}/> : <WhiskeyBottle color={c} size={size}/>;
    }

    // ─── Shared UI ────────────────────────────────────────────────────────
    function Btn({ onClick, variant='ghost', style:sx, disabled, children }) {

        ghost:   { background:'none',    border:'1px solid #3A2818', color:'#9A7D65' },

    function TypeTag({ active, color, onClick, children }) {

    function FField({ label, children, hint }) {

    function Box({ accentColor, title, children, style:sx }) {

        {title && <div style={{fontSize:'9px',color:accentColor||'#9A836C',textTransform:'uppercase',letterSpacing:'.1em',fontWeight:'600',marginBottom:'12px'}}>{title}</div>}

    function DSection({ title, children }) {
      return (<div style={{marginBottom:'18px'}}>
        <div style={{fontSize:'9px',color:'#A88C71',textTransform:'uppercase',letterSpacing:'.12em',fontWeight:'600',marginBottom:'9px'}}>{title}</div>
        {children}
      </div>);
    }
    function DRow({ label, value }) {
      if (!value) return null;
      return (<div style={{display:'flex',justifyContent:'space-between',gap:'8px',marginBottom:'5px'}}>
        <span style={{fontSize:'11px',color:'#A3886E',flexShrink:0}}>{label}</span>
        <span style={{fontSize:'11px',color:'#B09070',textAlign:'right'}}>{value}</span>
      </div>);
    }
    function SortBar({ sortBy, sortDir, typeFilter, onChange }) {
      const descFirst = new Set(['rating','year','ageStatement']);
      return (
        <div style={{display:'flex',alignItems:'center',gap:'6px',overflowX:'auto',WebkitOverflowScrolling:'touch',scrollbarWidth:'none',msOverflowStyle:'none',paddingBottom:'1px'}}>
          <span style={{fontSize:'10px',color:'#A3886E',textTransform:'uppercase',letterSpacing:'.08em',whiteSpace:'nowrap',marginRight:'2px',flexShrink:0}}>Sort</span>
          {getSortOptions(typeFilter).map(([key,label]) => {
            const active = sortBy === key;
            const defaultDir = descFirst.has(key) ? 'desc' : 'asc';
            return (<button key={key} onClick={() => onChange(key, active ? (sortDir==='asc'?'desc':'asc') : defaultDir)}
              style={{padding:'5px 11px',borderRadius:'14px',fontSize:'11px',whiteSpace:'nowrap',flexShrink:0,border:active?'1px solid #C8922A':'1px solid #1E1610',background:active?'#1C1208':'transparent',color:active?'#C8922A':'#A88C71',fontWeight:active?'600':'400'}}>
              {label}{active ? (sortDir==='asc' ? ' ↑' : ' ↓') : ''}
            </button>);
          })}
        </div>
      );
    }

    // ─── Mini stock-entry form (used in DrinkDetail) ───────────────────────
    function AddStockForm({ onAdd, onCancel, occupiedPositions }) {
      const locations = useLocations();
      const [loc,    setLoc]    = useState(locations[0]?.id || '');
      const [sub,    setSub]    = useState(locations[0]?.slots[0] || '');
      const [pos,    setPos]    = useState('');
      const [qty,    setQty]    = useState(1);
      const selLoc = locations.find(l => l.id === loc);

      function handleLocChange(id) {
        setLoc(id);
        setSub(locations.find(l=>l.id===id)?.slots[0] || '');
        setPos('');
      }
      function submit() {
        if (selLoc?.positionsPerRow && !pos) {
          alert('This rack tracks individual positions — please select a position before adding.');
          return;
        }
        const posNum = pos ? +pos : null;
        if (posNum && occupiedPositions?.has(`${loc}:${sub}:${posNum}`)) {
          alert(`Position ${posNum} in this row is already occupied by another bottle.`);
          return;
        }
        onAdd({ id:uid(), location:loc, sublocation:sub, position:posNum, quantity:Math.max(1,+qty||1), dateAdded:today(), status:'in_stock', dateFinished:null });
      }

      return (<div style={{background:'#0C0806',border:'1px solid #2A1E16',borderRadius:'8px',padding:'14px',marginTop:'10px'}}>
        <div style={{fontSize:'11px',color:'#C8922A',marginBottom:'12px',fontWeight:'600'}}>Add Location</div>
        <div style={{display:'flex',flexDirection:'column',gap:'10px'}}>
          <FField label="Location">
            <select value={loc} onChange={e=>handleLocChange(e.target.value)}>
              {locations.map(l=><option key={l.id} value={l.id}>{l.name}</option>)}
            </select>
          </FField>
          <FRow>
            <FField label="Row / Shelf">
              <select value={sub} onChange={e=>{setSub(e.target.value);setPos('');}}>
                {(selLoc?.slots||[]).map(s=><option key={s} value={s}>{s}</option>)}
              </select>
            </FField>
            {selLoc?.positionsPerRow && (
              <FField label="Position" hint={!pos?"Pick a slot or it won't show on the rack grid":undefined}>
                <select value={pos} onChange={e=>setPos(e.target.value)} style={{borderColor:!pos?'#C8602A':undefined}}>
                  <option value="">— pick one —</option>
                  {Array.from({length:selLoc.positionsPerRow},(_,i)=>i+1).map(p=>{
                    const taken = occupiedPositions?.has(`${loc}:${sub}:${p}`);
                    return <option key={p} value={p} disabled={taken}>{p}{taken?' ✕':''}</option>;
                  })}
                </select>
              </FField>
            )}
            <FField label="Qty">
              <input type="number" value={qty} onChange={e=>setQty(e.target.value)} min="1"/>
            </FField>
          </FRow>
          <div style={{display:'flex',gap:'8px',marginTop:'4px'}}>
            <Btn onClick={submit} variant="primary">Add</Btn>
            <Btn onClick={onCancel}>Cancel</Btn>

        </div>
      </div>);
    }

    function InlineBox({ title, children }) {

    // ─── Stock Entry Row ──────────────────────────────────────────────────────
    // Handles partial finish and partial move for entries with qty > 1.
    // A position slot holds 1 bottle: moving to a position rack caps qty at 1.
    function StockEntryRow({ entry, drinkId, onFinish, onRemove, onMove, occupiedPositions }) {
      const [mode,      setMode]   = useState(null); // null | 'finish' | 'move'
      const [actionQty, setActionQty] = useState(1);
      const [loc, setLoc] = useState(entry.location);
      const [sub, setSub] = useState(entry.sublocation);
      const [pos, setPos] = useState(entry.position || '');
      const locName   = useLocName();
      const locations = useLocations();
      const selLoc    = locations.find(l => l.id === loc);
      // Position racks hold 1 bottle per slot — cap move qty to 1
      const maxMoveQty = selLoc?.positionsPerRow && pos ? 1 : entry.quantity;

      function openMode(m) {
        setMode(m);
        setActionQty(m === 'move' ? entry.quantity : 1);
        setLoc(entry.location);
        setSub(entry.sublocation);
        setPos(entry.position || '');
      }
      function handleLocChange(id) {
        setLoc(id);
        setSub(locations.find(l=>l.id===id)?.slots[0] || '');
        setPos('');
        setActionQty(entry.quantity); // reset qty; recalculated by maxMoveQty
      }

      function confirmFinish() {
        const qty = Math.min(Math.max(1, actionQty), entry.quantity);
        onFinish(drinkId, entry.id, qty);
        setMode(null);
      }
      function confirmMove() {
        const qty = Math.min(Math.max(1, actionQty), maxMoveQty);
        const posNum = pos ? +pos : null;
        if (selLoc?.positionsPerRow && !posNum) {
          alert('This rack tracks individual positions — please select a position before moving.');
          return;
        }
        const isSelf = loc===entry.location && sub===entry.sublocation && posNum===entry.position;
        if (posNum && !isSelf && occupiedPositions?.has(`${loc}:${sub}:${posNum}`)) {
          alert(`Position ${posNum} in this row is already occupied by another bottle.`);
          return;
        }
        onMove(drinkId, entry.id, qty, { location:loc, sublocation:sub, position:posNum });
        setMode(null);
      }

      if (mode === 'finish') return <InlineBox title="Mark as finished">
        {entry.quantity > 1 && (
          <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
            <span style={{fontSize:'12px',color:'#A3886E'}}>How many?</span>
            <button onClick={()=>setActionQty(q=>Math.max(1,q-1))}
              style={{width:'28px',height:'28px',borderRadius:'5px',background:'#160E08',border:'1px solid #2A1E16',color:'#C0A890',fontSize:'16px',lineHeight:1}}>-</button>
            <span style={{fontFamily:"'Playfair Display', serif",fontSize:'18px',color:'#C8922A',minWidth:'20px',textAlign:'center'}}>{actionQty}</span>
            <button onClick={()=>setActionQty(q=>Math.min(entry.quantity,q+1))}
              style={{width:'28px',height:'28px',borderRadius:'5px',background:'#160E08',border:'1px solid #2A1E16',color:'#C0A890',fontSize:'16px',lineHeight:1}}>+</button>
            <span style={{fontSize:'11px',color:'#9A836C'}}>of {entry.quantity}</span>
          </div>
        )}
        <div style={{display:'flex',gap:'8px'}}>
          <Btn onClick={confirmFinish} variant="primary" style={{fontSize:'11px',padding:'6px 14px'}}>
            {entry.quantity > 1 && actionQty < entry.quantity ? `Finish ${actionQty}` : 'Mark Finished'}
          </Btn>
          <Btn onClick={()=>setMode(null)} style={{fontSize:'11px',padding:'6px 14px'}}>Cancel</Btn>
        </div>
      </InlineBox>;

      if (mode === 'move') return <InlineBox title="Move to…">
        {entry.quantity > 1 && (
          <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
            <span style={{fontSize:'12px',color:'#A3886E'}}>How many?</span>
            <button onClick={()=>setActionQty(q=>Math.max(1,q-1))}
              style={{width:'28px',height:'28px',borderRadius:'5px',background:'#160E08',border:'1px solid #2A1E16',color:'#C0A890',fontSize:'16px',lineHeight:1}}>-</button>
            <span style={{fontFamily:"'Playfair Display', serif",fontSize:'18px',color:'#C8922A',minWidth:'20px',textAlign:'center'}}>{Math.min(actionQty,maxMoveQty)}</span>
            <button onClick={()=>setActionQty(q=>Math.min(maxMoveQty,q+1))}
              style={{width:'28px',height:'28px',borderRadius:'5px',background:'#160E08',border:'1px solid #2A1E16',color:'#C0A890',fontSize:'16px',lineHeight:1}}>+</button>
            <span style={{fontSize:'11px',color:'#9A836C'}}>of {entry.quantity}</span>
            {maxMoveQty < entry.quantity && <span style={{fontSize:'10px',color:'#A3886E'}}>(position racks: 1 per slot)</span>}
          </div>
        )}
        <select value={loc} onChange={e=>handleLocChange(e.target.value)} style={{fontSize:'12px',padding:'7px 10px'}}>
          {locations.map(l=><option key={l.id} value={l.id}>{l.name}</option>)}
        </select>
        <div style={{display:'flex',gap:'8px'}}>
          <select value={sub} onChange={e=>{setSub(e.target.value);setPos('');}} style={{flex:1,fontSize:'12px',padding:'7px 10px'}}>
            {(selLoc?.slots||[]).map(s=><option key={s} value={s}>{s}</option>)}
          </select>
          {selLoc?.positionsPerRow && (
            <select value={pos} onChange={e=>setPos(e.target.value)} style={{width:'90px',fontSize:'12px',padding:'7px 10px',borderColor:!pos?'#C8602A':undefined}}>
              <option value="">— Position —</option>
              {Array.from({length:selLoc.positionsPerRow},(_,i)=>i+1).map(p=>{
                const isSelf = loc===entry.location && sub===entry.sublocation && p===+entry.position;
                const taken = !isSelf && occupiedPositions?.has(`${loc}:${sub}:${p}`);
                return <option key={p} value={p} disabled={taken}>{p}{taken?' ✕':''}</option>;
              })}
            </select>
          )}
        </div>
        <div style={{display:'flex',gap:'8px'}}>
          <Btn onClick={confirmMove} variant="primary" style={{fontSize:'11px',padding:'6px 14px'}}>Move here</Btn>
          <Btn onClick={()=>setMode(null)} style={{fontSize:'11px',padding:'6px 14px'}}>Cancel</Btn>
        </div>
      </InlineBox>;

      // Validate that this entry's location/slot/position still exists
      const entryLoc  = locations.find(l => l.id === entry.location);
      const slotOk    = !entryLoc?.slots?.length || entryLoc.slots.includes(entry.sublocation);
      const posOk     = !entry.position || !entryLoc?.positionsPerRow || entry.position <= entryLoc.positionsPerRow;
      const isStale   = !entryLoc || !slotOk || !posOk;

      return (
        <div style={{background:isStale?'#1C0E06':'#160E08',borderRadius:'6px',padding:'10px 12px',marginBottom:'7px',display:'flex',alignItems:'flex-start',gap:'8px',border:isStale?'1px solid #C8602A33':'none'}}>
          <div style={{flex:1,minWidth:0}}>
            {isStale && <div style={{fontSize:'10px',color:'#C8602A',marginBottom:'3px',fontWeight:'600'}}>⚠ Location no longer valid — please move</div>}
            <div style={{fontSize:'12px',color:isStale?'#C8602A':'#C0A890'}}>{locName(entry.location)}</div>
            <div style={{fontSize:'11px',color:'#9C856E',marginTop:'1px'}}>
              {entry.sublocation}
              {entry.position ? ` · Position ${entry.position}` : ''}
              {' · '}{entry.quantity} {entry.quantity===1?'bottle':'bottles'}
            </div>
          </div>
          <div style={{display:'flex',gap:'4px',flexShrink:0}}>
            <Btn onClick={()=>openMode('move')}   style={{fontSize:'10px',padding:'4px 9px',border:'1px solid #4A3020',color:isStale?'#C8922A':'#B09070'}}>Move</Btn>
            <Btn onClick={()=>openMode('finish')} style={{fontSize:'10px',padding:'4px 9px',border:'1px solid #4A3020',color:'#B09070'}}>Finished</Btn>
            <button onClick={()=>onRemove(drinkId,entry.id)} style={{background:'none',border:'none',color:'#9E8771',fontSize:'14px',padding:'2px 4px'}}>✕</button>
          </div>
        </div>
      );
    }

    // ─── Drink Detail Panel ────────────────────────────────────────────────
    function DrinkDetail({ drink, onEdit, onDelete, onAddStock, onFinishStock, onRemoveStock, onMoveStock, onClose, occupiedPositions }) {
      const [confirmDel, setConfirmDel] = useState(false);
      const [addingStock, setAddingStock] = useState(false);
      const locName = useLocName();
      const locations = useLocations();
      const inStock  = (drink.stock||[]).filter(s=>s.status==='in_stock');
      const finished = (drink.stock||[]).filter(s=>s.status==='finished');
      const hasNotes = hasTastingNotes(drink);
      const total    = inStock.reduce((s,e)=>s+e.quantity, 0);

      return (<div className="detail-panel">
        {/* Header */}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px'}}>
          <div>
            <button className="det-back"  onClick={onClose} style={{background:'none',border:'none',color:'#C8922A',fontSize:'14px'}}>← Back</button>
            <button className="det-close" onClick={onClose} style={{background:'none',border:'none',color:'#9A836C',fontSize:'16px'}}>✕</button>
          </div>
          <div style={{display:'flex',gap:'6px',flexWrap:'wrap',justifyContent:'flex-end'}}>
            <Btn onClick={()=>onEdit(drink)}>Edit</Btn>
            {confirmDel ? <Btn onClick={()=>onDelete(drink.id)} variant="danger">Confirm</Btn> : <Btn onClick={()=>setConfirmDel(true)}>Delete</Btn>}
          </div>
        </div>

        {/* Identity */}
        <div style={{display:'flex',gap:'14px',alignItems:'flex-start',marginBottom:'20px'}}>
          <Bottle drink={drink} size={88}/>
          <div style={{minWidth:0}}>
            <div style={{fontFamily:"'Playfair Display', serif",fontSize:'18px',fontWeight:'700',color:'#F0E6D3',lineHeight:'1.3',marginBottom:'5px'}}>{drink.name}</div>
            {drink.producer && <div style={{fontSize:'13px',color:'#9A7D65',marginBottom:'3px'}}>{drink.producer}</div>}
            {(drink.year || drink.isNV) && <div style={{fontSize:'12px',color:drink.isNV?'#C8922A':'#9C856E'}}>{drink.isNV?'Non-Vintage':drink.year}</div>}
          </div>
        </div>

        {/* Rating */}
        {(drink.rating != null || drink.expertRating != null) && (
          <div style={{background:'#160E08',borderRadius:'8px',padding:'14px 16px',marginBottom:'18px',display:'flex',alignItems:'center',gap:'16px',border:'1px solid #1C1208',flexWrap:'wrap'}}>
            {drink.rating != null && (
              <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
                <div style={{fontFamily:"'Playfair Display', serif",fontSize:'48px',fontWeight:'700',color:'#C8922A',lineHeight:'1'}}>{drink.rating}</div>
                <div>
                  <div style={{fontSize:'10px',color:'#A3886E',textTransform:'uppercase',letterSpacing:'.08em'}}>My Score</div>
                  {drink.reviewDate && <div style={{fontSize:'11px',color:'#9C856E',marginTop:'2px'}}>{drink.reviewDate}</div>}
                </div>
              </div>
            )}
            {drink.expertRating != null && (
              <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
                <div style={{fontFamily:"'Playfair Display', serif",fontSize:'48px',fontWeight:'700',color:'#7090B8',lineHeight:'1'}}>{drink.expertRating}</div>
                <div>
                  <div style={{fontSize:'10px',color:'#607EAA',textTransform:'uppercase',letterSpacing:'.08em'}}>Expert</div>
                  {drink.expertSource && <div style={{fontSize:'11px',color:'#73839A',marginTop:'2px'}}>{drink.expertSource}</div>}
                </div>
              </div>
            )}
          </div>
        )}

        {/* In Cellar */}
        {(inStock.length > 0 || addingStock) && (
          <DSection title={total > 0 ? `In Your Cellar · ${total} bottle${total>1?'s':''}` : 'In Your Cellar'}>
            {inStock.map(entry => (
              <StockEntryRow key={entry.id} entry={entry} drinkId={drink.id}
                onFinish={onFinishStock} onRemove={onRemoveStock} onMove={onMoveStock}
                occupiedPositions={occupiedPositions}/>
            ))}
            {addingStock ? (
              <AddStockForm onAdd={entry=>{onAddStock(drink.id,entry);setAddingStock(false);}} onCancel={()=>setAddingStock(false)} occupiedPositions={occupiedPositions}/>
            ) : (
              <button onClick={()=>setAddingStock(true)} style={{marginTop:'6px',background:'none',border:'1px dashed #2A1E16',color:'#9C856E',padding:'7px 14px',borderRadius:'5px',fontSize:'11px',width:'100%'}}>
                + Add Another Location
              </button>
            )}
          </DSection>
        )}
        {inStock.length === 0 && !addingStock && (
          <div style={{marginBottom:'16px'}}>
            <button onClick={()=>setAddingStock(true)} style={{background:'none',border:'1px dashed #2A1E16',color:'#9C856E',padding:'8px 16px',borderRadius:'6px',fontSize:'12px',width:'100%'}}>
              + Add to Cellar
            </button>
          </div>
        )}

        {/* Finished entries */}
        {finished.length > 0 && (
          <DSection title="Finished">
            {finished.map(entry => (
              <div key={entry.id} style={{fontSize:'11px',color:'#9A836C',marginBottom:'5px',display:'flex',justifyContent:'space-between'}}>
                <span>{locName(entry.location)} · {entry.sublocation}</span>
                {entry.dateFinished && <span style={{color:'#94816A'}}>{entry.dateFinished}</span>}
              </div>
            ))}
          </DSection>
        )}

        {/* Wine / Whiskey details */}
        {drink.type==='wine' ? (
          <DSection title="Wine Details">
            <DRow label="Colour"      value={cap(drink.wineColor)}/>
            <DRow label="Grape"       value={drink.grape}/>
            <DRow label="Region"      value={drink.region}/>
            <DRow label="Appellation" value={drink.appellation}/>
          </DSection>
        ) : (
          <DSection title="Whisky Details">
            <DRow label="Style"     value={cap(drink.whiskyStyle)}/>
            <DRow label="Region"    value={drink.whiskyRegion}/>
            <DRow label="Age" value={drink.isNAS?'NAS (No Age Statement)':drink.ageStatement?`${drink.ageStatement} years`:null}/>
            <DRow label="ABV"       value={drink.abv ? `${drink.abv}%` : null}/>
            <DRow label="Cask"      value={drink.caskType}/>
            <DRow label="Mash Bill" value={drink.mashBill}/>
          </DSection>
        )}

        {hasNotes && (
          <DSection title="Tasting Notes">
            <DRow label="Nose"   value={drink.tastingNotes?.nose}/>
            <DRow label="Palate" value={drink.tastingNotes?.palate}/>
            <DRow label="Finish" value={drink.tastingNotes?.finish}/>
          </DSection>
        )}
        {drink.review && (
          <DSection title="Review">
            <div style={{fontSize:'12px',color:'#9A7D65',lineHeight:'1.65',fontStyle:'italic'}}>"{drink.review}"</div>
          </DSection>
        )}
        {drink.price != null && drink.price !== '' && <div style={{fontSize:'11px',color:'#A3886E',marginTop:'8px'}}>≈ ${drink.price} per bottle</div>}
      </div>);
    }

    // ─── Mobile Header ─────────────────────────────────────────────────────
    function MobileHeader({ drinkCount, totalBottles, onNav }) {
      return (<div className="mob-header" style={{padding:'14px 20px 12px',background:'#090503',borderBottom:'1px solid #1A1008',justifyContent:'space-between',alignItems:'center',flexShrink:0}}>
        <div>
          <div style={{fontFamily:"'Playfair Display', serif",fontSize:'22px',fontWeight:'700',color:'#C8922A',lineHeight:1}}>My Cellar</div>
          <div style={{fontSize:'10px',color:'#A3886E',marginTop:'3px',letterSpacing:'.1em',textTransform:'uppercase'}}>{drinkCount} {drinkCount===1?'drink':'drinks'}</div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:'14px'}}>
          {totalBottles > 0 && (<div style={{textAlign:'right'}}>
            <div style={{fontFamily:"'Playfair Display', serif",fontSize:'22px',fontWeight:'700',color:'#C8922A',lineHeight:1}}>{totalBottles}</div>
            <div style={{fontSize:'10px',color:'#A3886E',marginTop:'3px',letterSpacing:'.1em',textTransform:'uppercase'}}>bottles</div>
          </div>)}
          <button onClick={()=>onNav('settings')} style={{background:'none',border:'none',color:'#94816A',fontSize:'20px',cursor:'pointer',padding:'4px',lineHeight:1,flexShrink:0}} title="Cellar Management">⚙</button>
        </div>
      </div>);
    }

    // ─── Bottom Nav ────────────────────────────────────────────────────────
    function BottomNav({ view, onNav, onAdd }) {
      // Using actual emoji characters — no escape sequences that might fail
      const tabs = [
        { id:'cellar',   label:'Cellar',   icon:'🍾' },
        { id:'map',      label:'Map',       icon:'📍' },
        { id:'tastings', label:'Tastings',  icon:'📓' },
        { id:'add',      label:'Add',       icon:'+' },
      ];
      return (<div className="bot-nav" style={{background:'#090503',borderTop:'1px solid #1A1008',paddingBottom:'env(safe-area-inset-bottom)',flexShrink:0}}>
        {tabs.map(tab => {
          const active = view===tab.id || (tab.id==='map' && view==='locations');
          return (<div key={tab.id} onClick={tab.id==='add' ? onAdd : ()=>onNav(tab.id)}
            style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:'3px',padding:'10px 0 8px',cursor:'pointer',color:active?'#C8922A':'#A3886E'}}>
            <span style={{fontSize:'22px',lineHeight:1}}>{tab.icon}</span>
            <span style={{fontSize:'10px',fontWeight:active?'600':'400'}}>{tab.label}</span>
          </div>);
        })}
      </div>);
    }

    // ─── Desktop Sidebar ───────────────────────────────────────────────────
    function Sidebar({ view, onNav, onAdd, drinks, user }) {
      const inCellar  = drinks.filter(isInCellar);
      const wineCount = inCellar.filter(d=>d.type==='wine').length;
      const wkCount   = inCellar.filter(d=>d.type==='whisky').length;
      const tv = drinks.reduce((s,d) => s + inStockEntries(d).reduce((ss,e)=>ss+(d.price||0)*e.quantity,0), 0);
      const NAV = [
        { id:'cellar',   label:'My Cellar',  icon:'🍾' },
        { id:'map',      label:'Cellar Map',  icon:'📍' },
        { id:'tastings', label:'Tastings',    icon:'📓' },
      ];
      return (<aside className="app-sidebar" style={{width:'205px',flexShrink:0,background:'#090503',borderRight:'1px solid #1A1008',flexDirection:'column'}}>
        <div style={{padding:'22px 20px 16px',borderBottom:'1px solid #160E08'}}>
          <div style={{fontFamily:"'Playfair Display', serif",fontSize:'20px',fontWeight:'700',color:'#C8922A'}}>My Cellar</div>
          <div style={{fontSize:'10px',color:'#A3886E',marginTop:'3px',letterSpacing:'.1em',textTransform:'uppercase'}}>{inCellar.length} in cellar</div>
        </div>
        <nav style={{padding:'11px 8px',flex:1}}>
          {NAV.map(item => {
            const active = view===item.id || (item.id==='map' && view==='locations') || (item.id==='settings' && view==='settings');
            return (<div key={item.id} onClick={()=>onNav(item.id)} style={{display:'flex',alignItems:'center',gap:'10px',padding:'10px 12px',borderRadius:'7px',marginBottom:'2px',cursor:'pointer',background:active?'#1C1208':'transparent',color:active?'#C8922A':'#9A7D65',fontSize:'13px',fontWeight:active?'600':'400'}}>
              <span style={{fontSize:'16px'}}>{item.icon}</span>{item.label}
            </div>);
          })}
          <div style={{height:'1px',background:'#160E08',margin:'8px 0'}}/>
          <div onClick={onAdd} style={{display:'flex',alignItems:'center',gap:'10px',padding:'10px 12px',borderRadius:'7px',cursor:'pointer',background:view==='add'?'#1C1208':'transparent',color:view==='add'?'#C8922A':'#9A7D65',fontSize:'13px',fontWeight:view==='add'?'600':'400'}}>
            <span style={{fontSize:'17px',lineHeight:1}}>+</span>Add Drink
          </div>
        </nav>
        <div style={{padding:'13px 17px',borderTop:'1px solid #160E08'}}>
          {[['Wine',wineCount,'#8B1A35'],['Whisky',wkCount,'#C07A2A']].map(([l,c,col])=>(
            <div key={l} style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'7px'}}>
              <div style={{width:'5px',height:'5px',borderRadius:'50%',background:col,flexShrink:0}}/>
              <span style={{fontSize:'11px',color:'#94816A',flex:1}}>{l}</span>
              <span style={{fontSize:'11px',color:'#9E8771'}}>{c}</span>
            </div>
          ))}
          {tv > 0 && (<div style={{marginTop:'8px',paddingTop:'8px',borderTop:'1px solid #160E08'}}>
            <div style={{fontSize:'9px',color:'#94816A',textTransform:'uppercase',letterSpacing:'.08em'}}>Est. Value</div>
            <div style={{fontFamily:"'Playfair Display', serif",fontSize:'14px',color:'#C8922A',fontWeight:'600',marginTop:'2px'}}>${tv.toLocaleString()}</div>
          </div>)}
          <div style={{marginTop:'8px',paddingTop:'8px',borderTop:'1px solid #160E08',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div title={user.email} style={{fontSize:'10px',color:'#9E8771',letterSpacing:'.02em',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:'170px'}}>{user.name || user.email}</div>
            <button onClick={()=>onNav('settings')} style={{background:'none',border:'none',color:'#94816A',fontSize:'12px',cursor:'pointer',padding:'2px 4px'}} title="Cellar Management">⚙</button>
          </div>
        </div>
      </aside>);
    }

    // ─── Cellar View ───────────────────────────────────────────────────────
    function CellarView({ drinks, onEdit, onDelete, onAddStock, onFinishStock, onRemoveStock, onMoveStock, occupiedPositions, selected, onSelect }) {
      const [typeFilter, setTypeFilter] = useState('all');
      const [query,      setQuery]      = useState('');
      const [sortBy,     setSortBy]     = useState('name');
      const [sortDir,    setSortDir]    = useState('asc');
      const [ratingMode, setRatingMode] = useState('personal');
      const locations = useLocations();

      function handleTypeFilter(v) {
        setTypeFilter(v);
        // Reset sort keys that aren't valid for the chosen filter
        const invalid = {
          all:    ['subtype','year','ageStatement','grape','region'],
          wine:   ['ageStatement'],
          whisky: ['year','grape','region'],
        };
        if ((invalid[v]||[]).includes(sortBy)) setSortBy('name');
      }

      const cellarDrinks = drinks.filter(isInCellar);
      const filtered = cellarDrinks.filter(d => {
        if (typeFilter !== 'all' && d.type !== typeFilter) return false;
        if (query) { const q=query.toLowerCase(); return [d.name,d.producer,d.region,d.whiskyRegion,d.grape,d.appellation,d.wineColor,d.whiskyStyle,d.year?.toString(),d.ageStatement?.toString()].some(s=>s?.toLowerCase().includes(q)); }
        return true;
      });
      const sorted = sortDrinks(filtered, sortBy, sortDir, locations, ratingMode);

      return (<div style={{display:'flex',height:'100%',overflow:'hidden'}}>
        <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
          <div style={{padding:'12px 16px 8px',display:'flex',gap:'8px',alignItems:'center',flexWrap:'wrap',background:'#0A0604',flexShrink:0}}>
            <input type="text" placeholder="Search…" value={query} onChange={e=>setQuery(e.target.value)} style={{flex:1,minWidth:'130px'}}/>
            <div style={{display:'flex',gap:'5px'}}>
              {[['all','All'],['wine','Wine 🍷'],['whisky','Whisky 🥃']].map(([v,l])=>(
                <button key={v} onClick={()=>handleTypeFilter(v)} style={{padding:'7px 12px',borderRadius:'20px',fontSize:'12px',whiteSpace:'nowrap',border:typeFilter===v?'1px solid #C8922A':'1px solid #1E1610',background:typeFilter===v?'#1C1208':'transparent',color:typeFilter===v?'#C8922A':'#9C856E',fontWeight:typeFilter===v?'600':'400'}}>{l}</button>
              ))}
            </div>
          </div>
          <div style={{padding:'6px 16px 10px',borderBottom:'1px solid #160E08',background:'#0A0604',flexShrink:0,display:'flex',justifyContent:'space-between',alignItems:'center',gap:'8px',flexWrap:'wrap'}}>
            <SortBar sortBy={sortBy} sortDir={sortDir} typeFilter={typeFilter} onChange={(k,d)=>{setSortBy(k);setSortDir(d);}}/>
            <div style={{display:'flex',alignItems:'center',gap:'6px',flexShrink:0}}>
              <span style={{fontSize:'10px',color:'#A3886E',textTransform:'uppercase',letterSpacing:'.08em',whiteSpace:'nowrap',flexShrink:0}}>Rating</span>
              {[['personal','Mine'],['expert','Expert'],['both','Both']].map(([v,l])=>(
                <button key={v} onClick={()=>setRatingMode(v)} style={{padding:'4px 9px',borderRadius:'12px',fontSize:'10px',border:ratingMode===v?'1px solid #7090B8':'1px solid #1E1610',background:ratingMode===v?'#080C18':'transparent',color:ratingMode===v?'#7090B8':'#9C856E',whiteSpace:'nowrap'}}>{l}</button>
              ))}
            </div>
            <span style={{fontSize:'11px',color:'#A3886E',whiteSpace:'nowrap'}}>{sorted.length} {sorted.length===1?'drink':'drinks'}</span>
          </div>
          <div style={{flex:1,overflow:'auto',padding:'14px'}}>
            {sorted.length === 0 ? (
              <div style={{textAlign:'center',padding:'80px 20px',color:'#94816A'}}>
                <div style={{fontFamily:"'Playfair Display', serif",fontSize:'18px',color:'#9E8768',marginBottom:'6px'}}>{cellarDrinks.length===0?'Your cellar is empty':'No drinks match'}</div>
                <div style={{fontSize:'12px'}}>{cellarDrinks.length===0?'Add your first bottle to begin':'Try adjusting your search or filter'}</div>
              </div>
            ) : (
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill, minmax(145px, 1fr))',gap:'10px'}}>
                {sorted.map(d => <DrinkCard key={d.id} drink={d} isSelected={selected?.id===d.id} onClick={()=>onSelect(selected?.id===d.id?null:d)} ratingMode={ratingMode}/>)}
              </div>
            )}
          </div>
        </div>
        {selected && <DrinkDetail drink={selected} onEdit={onEdit} onDelete={onDelete} onAddStock={onAddStock} onFinishStock={onFinishStock} onRemoveStock={onRemoveStock} onMoveStock={onMoveStock} onClose={()=>onSelect(null)} occupiedPositions={occupiedPositions}/>}
      </div>);
    }

    function DrinkCard({ drink, isSelected, onClick, ratingMode='personal' }) {
      const [hov, setHov] = useState(false);
      const locName = useLocName();
      const stock = inStockEntries(drink);
      const total = stock.reduce((s,e)=>s+e.quantity, 0);
      const uniqueLocs = [...new Set(stock.map(s => locName(s.location)))];
      const locText = uniqueLocs.length === 0 ? null
        : uniqueLocs.length === 1 ? uniqueLocs[0]
        : uniqueLocs.length === 2 ? uniqueLocs[0] + ' & ' + uniqueLocs[1]
        : uniqueLocs[0] + ' & ' + (uniqueLocs.length - 1) + ' others';
      return (<div onClick={onClick}
        onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
        onTouchStart={()=>setHov(true)} onTouchEnd={()=>setHov(false)}
        style={{background:isSelected?'#1C1308':hov?'#160E0B':'#110B09',border:`1px solid ${isSelected?'#C8922A':'#1C1208'}`,borderRadius:'10px',padding:'14px 10px 12px',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:'9px',position:'relative',transition:'all 0.15s'}}>
        {total > 1 && <div style={{position:'absolute',top:'8px',right:'8px',background:'#C8922A',color:'#0C0806',borderRadius:'8px',padding:'1px 6px',fontSize:'10px',fontWeight:'700'}}>×{total}</div>}
        <div style={{height:'64px',display:'flex',alignItems:'center',justifyContent:'center'}}><Bottle drink={drink} size={64}/></div>
        <div style={{textAlign:'center',width:'100%'}}>

              <span style={{fontFamily:"'Playfair Display', serif",fontSize:'13px',fontWeight:'700',color:'#7090B8'}}>{drink.expertRating}</span>
              <span style={{fontSize:'9px',color:'#94816A'}}>pts</span>

            <div>
              <h1 style={{fontFamily:"'Playfair Display', serif",fontSize:'20px',fontWeight:'700',color:'#F0E6D3'}}>Cellar Map</h1>
              <p style={{color:'#A3886E',fontSize:'11px',marginTop:'2px'}}>Tap any bottle for details</p>

            <Btn onClick={onManageLocations}>⚙ Locations</Btn>

              <button onClick={onManageLocations} style={{background:'none',border:'1px solid #2A1E16',color:'#C8922A',padding:'8px 18px',borderRadius:'7px',fontSize:'13px'}}>Add your first location</button>
            </div>)}
          </div>

        {selected && <DrinkDetail drink={selected} onEdit={onEdit} onDelete={onDelete} onAddStock={onAddStock} onFinishStock={onFinishStock} onRemoveStock={onRemoveStock} onMoveStock={onMoveStock} onClose={()=>onSelect(null)} occupiedPositions={occupiedPositions}/>}
      </div>);

    function LocationBlock({ loc, entries, selected, onSelect }) {
      const hasPositions = !!loc.positionsPerRow;
      const slots = loc.slots || [];
      // Bottles whose sublocation doesn't match any defined slot — includes ALL bottles
      // when there are no slots, and orphaned bottles when a slot was deleted.
      const unslotted = entries.filter(e => !slots.includes(e.sublocation));

      function renderBottles(list) {
        return (<div style={{background:'#0A0604',borderRadius:'5px',minHeight:'32px',padding:'3px 6px',display:'flex',alignItems:'center',gap:'3px',flexWrap:'wrap',border:'1px solid #160E08'}}>
          {list.length===0 ? <span style={{fontSize:'10px',color:'#90806B',fontStyle:'italic'}}>empty</span> : list.map(e => {
            const isSel = selected?.id === e.drink.id;
            return (<div key={e.id} title={e.drink.name} onClick={()=>onSelect(isSel?null:e.drink)} style={{cursor:'pointer',position:'relative',transform:isSel?'scale(1.18)':'scale(1)',transition:'transform 0.1s'}}>
              <Bottle drink={e.drink} size={28} colorOverride={isSel?'#C8922A':undefined}/>
              {e.quantity>1 && <span style={{position:'absolute',bottom:0,right:'-2px',fontSize:'7px',background:'#C8922A',color:'#0C0806',borderRadius:'4px',padding:'0 3px',fontWeight:'700',lineHeight:'1.4'}}>{e.quantity}</span>}
            </div>);
          })}
        </div>);
      }

      return (<div style={{background:'#110B09',border:'1px solid #1A1008',borderRadius:'10px',overflow:'hidden'}}>
        <div style={{padding:'11px 14px 8px',borderBottom:'1px solid #160E08',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div style={{fontFamily:"'Playfair Display', serif",fontSize:'13px',fontWeight:'600',color:loc.system?'#C8602A':'#C8922A'}}>{loc.name}{loc.system&&entries.length>0?' ⚠':''}</div>
          <div style={{fontSize:'11px',color:'#94816A'}}>{entries.reduce((s,e)=>s+e.quantity,0)} bottles</div>
        </div>
        <div style={{padding:'10px 12px 12px'}}>
          {slots.map(slot => {
            const se = entries.filter(e=>e.sublocation===slot);
            return (<div key={slot} style={{marginBottom:'10px'}}>
              <div style={{fontSize:'9px',color:'#9E8771',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:'5px'}}>{slot}</div>
              {hasPositions ? (<>
                <PositionGrid positionsPerRow={loc.positionsPerRow} entries={se.filter(e=>e.position!=null)} selected={selected} onSelect={onSelect}/>
                {se.filter(e=>e.position==null).length > 0 && (
                  <div style={{marginTop:'4px',padding:'4px 6px',background:'#0A0604',borderRadius:'4px',border:'1px dashed #2A1E16',display:'flex',alignItems:'center',gap:'4px',flexWrap:'wrap'}}>
                    <span style={{fontSize:'9px',color:'#9C856E',marginRight:'2px'}}>No position:</span>
                    {se.filter(e=>e.position==null).map(e => {
                      const isSel = selected?.id===e.drink.id;
                      return (<div key={e.id} title={e.drink.name} onClick={()=>onSelect(isSel?null:e.drink)} style={{cursor:'pointer',position:'relative',transform:isSel?'scale(1.18)':'scale(1)',transition:'transform 0.1s'}}>
                        <Bottle drink={e.drink} size={24} colorOverride={isSel?'#C8922A':undefined}/>
                        {e.quantity>1 && <span style={{position:'absolute',bottom:0,right:'-2px',fontSize:'7px',background:'#C8922A',color:'#0C0806',borderRadius:'3px',padding:'0 2px',fontWeight:'700'}}>{e.quantity}</span>}
                      </div>);
                    })}
                  </div>
                )}
              </>) : renderBottles(se)}
            </div>);
          })}
          {/* Bottles with no matching slot: shown when location has no slots at all,
              or when a slot was deleted after bottles were assigned to it. */}
          {unslotted.length > 0 && (
            <div style={{marginBottom:'10px'}}>
              <div style={{fontSize:'9px',color:slots.length===0?'#9E8771':'#C8602A',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:'5px'}}>
                {slots.length === 0 ? 'Bottles' : 'No shelf assigned ⚠'}
              </div>
              {renderBottles(unslotted)}
            </div>
          )}
        </div>
      </div>);
    }

    function PositionGrid({ positionsPerRow, entries, selected, onSelect }) {
      const cols = Math.min(positionsPerRow, 16);
      return (<div style={{display:'grid',gridTemplateColumns:`repeat(${cols}, 1fr)`,gap:'4px',background:'#0A0604',borderRadius:'5px',padding:'6px',border:'1px solid #160E08'}}>
        {Array.from({length:positionsPerRow}, (_,i) => {
          const pos   = i + 1;
          const entry = entries.find(e=>e.position===pos);
          const isSel = entry && selected?.id===entry.drink.id;
          return (<div key={pos}
            onClick={entry?()=>onSelect(isSel?null:entry.drink):undefined}
            title={entry?`${entry.drink.name} \u2014 Position ${pos}`:`Position ${pos} \u2014 empty`}
            style={{display:'flex',flexDirection:'column',alignItems:'center',cursor:entry?'pointer':'default',
              position:'relative',transform:isSel?'scale(1.1)':'scale(1)',transition:'transform 0.15s'}}>
            {entry
              ? <Bottle drink={entry.drink} size={30} colorOverride={isSel?'#C8922A':undefined}/>
              : <div style={{opacity:0.13}}><WineBottle color="#8A6A50" size={30}/></div>
            }
            <span style={{fontSize:'7px',color:entry?(isSel?'#C8922A':'#94816A'):'#1E1410',lineHeight:1,marginTop:'1px'}}>{pos}</span>
            {entry?.quantity>1 && (
              <span style={{position:'absolute',top:0,right:'-1px',fontSize:'7px',background:'#C8922A',color:'#0C0806',borderRadius:'3px',padding:'0 2px',fontWeight:'700',lineHeight:'1.4'}}>{entry.quantity}</span>
            )}
          </div>);
        })}
      </div>);
    }

    // ─── Manage Locations ──────────────────────────────────────────────────
    function ManageLocationsView({ onClose, drinks, onUpdateLocations, onSaveDrinks }) {
      const locations = useLocations();
      const [newName, setNewName] = useState('');
      const allStock = drinks.flatMap(d => d.stock||[]);
      function save(updated) { onUpdateLocations(updated); }
      function addLocation() { if(!newName.trim())return; save([...locations,{id:uid(),name:newName.trim(),slots:['Shelf 1'],positionsPerRow:null}]); setNewName(''); }
      // Central data-integrity function for any location change.
      // Detects slot renames, slot deletions, and positionsPerRow reductions
      // and updates bottle data accordingly — keeping stock references valid.
      async function updateLocation(updated) {
        const old = locations.find(l => l.id === updated.id);
        if (old) {
          const updates = new Map(); // drinkId → updated drink object
          const get = d => updates.get(d.id) || {...d, stock:[...d.stock]};

          // Renamed slots: update sublocation on bottles that used the old name
          old.slots.forEach((oldName, i) => {
            const newName = updated.slots[i];
            if (newName && oldName !== newName) {
              drinks.forEach(d => {
                if (!d.stock.some(s => s.location===updated.id && s.sublocation===oldName)) return;
                const drink = get(d);
                drink.stock = drink.stock.map(s =>
                  s.location===updated.id && s.sublocation===oldName ? {...s, sublocation:newName} : s
                );
                updates.set(d.id, drink);
              });
            }
          });

          // Deleted slots: orphan in-stock bottles to Unassigned
          const deletedSlots = old.slots.filter(s => !updated.slots.includes(s));
          if (deletedSlots.length > 0) {
            drinks.forEach(d => {
              if (!d.stock.some(s => s.status==='in_stock' && s.location===updated.id && deletedSlots.includes(s.sublocation))) return;
              const drink = get(d);
              drink.stock = drink.stock.map(s =>
                s.status==='in_stock' && s.location===updated.id && deletedSlots.includes(s.sublocation)
                  ? {...s, location:'unassigned', sublocation:'Needs Reassignment', position:null}
                  : s
              );
              updates.set(d.id, drink);
            });
          }

          // Reduced positionsPerRow: orphan bottles at positions now out of range.
          // Bottles within the new range keep their position unchanged.
          const oldMax = old.positionsPerRow || 0;
          const newMax = updated.positionsPerRow || 0;
          if (oldMax > 0 && newMax < oldMax) {
            drinks.forEach(d => {
              if (!d.stock.some(s => s.status==='in_stock' && s.location===updated.id && s.position > newMax)) return;
              const drink = get(d);
              drink.stock = drink.stock.map(s =>
                s.status==='in_stock' && s.location===updated.id && s.position > newMax
                  ? {...s, location:'unassigned', sublocation:'Needs Reassignment', position:null}
                  : s
              );
              updates.set(d.id, drink);
            });
          }

          if (updates.size > 0) await onSaveDrinks([...updates.values()]);
        }
        save(locations.map(l => l.id===updated.id ? updated : l));
      }

      async function deleteLocation(id) {
        const count = allStock.filter(s=>s.location===id&&s.status==='in_stock').length;
        if (!window.confirm(count>0?`${count} bottle${count>1?'s':''} stored here will move to Unassigned. Delete location?`:'Delete this location?')) return;
        // Orphan all in-stock bottles from this location
        const affected = drinks
          .filter(d => d.stock.some(s => s.status==='in_stock' && s.location===id))
          .map(d => ({...d, stock:d.stock.map(s =>
            s.status==='in_stock' && s.location===id
              ? {...s, location:'unassigned', sublocation:'Needs Reassignment', position:null} : s
          )}));
        if (affected.length > 0) await onSaveDrinks(affected);
        save(locations.filter(l=>l.id!==id));
      }
      return (<div style={{height:'100%',display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <div style={{padding:'16px 18px',borderBottom:'1px solid #160E08',display:'flex',alignItems:'center',justifyContent:'space-between',background:'#0A0604',flexShrink:0}}>
          <h1 style={{fontFamily:"'Playfair Display', serif",fontSize:'19px',fontWeight:'700',color:'#F0E6D3'}}>Manage Locations</h1>
          <button onClick={onClose} style={{background:'none',border:'none',color:'#9A836C',fontSize:'18px'}}>✕</button>
        </div>
        <div style={{flex:1,overflow:'auto',padding:'16px 18px 60px'}}>
          <p style={{fontSize:'12px',color:'#A88C71',marginBottom:'18px',lineHeight:'1.6'}}>Tap a name or shelf to rename. Set Positions per row on racks to enable numbered slot tracking.</p>
          {locations.map(loc => {
            const cnt = allStock.filter(s=>s.location===loc.id&&s.status==='in_stock').length;
            return <LocationEditor key={loc.id} loc={loc} bottleCount={cnt} onUpdate={updateLocation} onDelete={()=>deleteLocation(loc.id)}/>;
          })}
          <div style={{marginTop:'8px',padding:'16px',background:'#0E0A07',borderRadius:'8px',border:'1px solid #1A1008'}}>
            <div style={{fontSize:'10px',color:'#A3886E',textTransform:'uppercase',letterSpacing:'.09em',fontWeight:'600',marginBottom:'10px'}}>Add New Location</div>
            <div style={{display:'flex',gap:'8px'}}>
              <input value={newName} onChange={e=>setNewName(e.target.value)} placeholder="e.g. Guest Room Rack…" onKeyDown={e=>e.key==='Enter'&&addLocation()}/>
              <Btn onClick={addLocation} variant="primary" style={{whiteSpace:'nowrap',flexShrink:0,padding:'9px 16px'}}>Add</Btn>
            </div>
          </div>
        </div>
      </div>);
    }

    function LocationEditor({ loc, bottleCount, onUpdate, onDelete }) {
      const [name,      setName]      = useState(loc.name);
      const [slots,     setSlots]     = useState(loc.slots);
      const [positions, setPositions] = useState(loc.positionsPerRow ?? '');
      const [confirmDel, setConfirmDel] = useState(false);
      useEffect(() => { setName(loc.name); },                [loc.id]);
      useEffect(() => { setSlots(loc.slots); },              [loc.slots.join('||')]);
      useEffect(() => { setPositions(loc.positionsPerRow ?? ''); }, [loc.positionsPerRow]);
      function saveName()    { if (name.trim()!==loc.name) onUpdate({...loc,name:name.trim()}); }
      function saveSlot(i)   { const s=[...loc.slots]; s[i]=slots[i]; setSlots(s); onUpdate({...loc,slots:s}); }
      function addSlot()     { onUpdate({...loc,slots:[...loc.slots,`Slot ${loc.slots.length+1}`]}); }
      function deleteSlot(i) {
        // updateLocation in ManageLocationsView detects deleted slots and
        // orphans any bottles to Unassigned automatically.
        onUpdate({...loc, slots:loc.slots.filter((_,idx)=>idx!==i)});
      }
      function moveSlot(i,dir) {
        const s=[...slots]; [s[i],s[i+dir]]=[s[i+dir],s[i]];
        setSlots(s); onUpdate({...loc,slots:s});
      }
      return (<div style={{background:'#110B09',border:'1px solid #1A1008',borderRadius:'10px',marginBottom:'12px',overflow:'hidden'}}>
        <div style={{padding:'13px 14px',borderBottom:'1px solid #160E08',display:'flex',alignItems:'center',gap:'10px'}}>
          <input value={name} onChange={e=>setName(e.target.value)} onBlur={saveName} readOnly={!!loc.system}
            style={{flex:1,fontFamily:"'Playfair Display', serif",fontSize:'14px',color:loc.system?'#9A7D65':'#C8922A',background:'transparent',border:'none',borderBottom:loc.system?'none':'1px solid #2A1A10',borderRadius:0,padding:'2px 4px',width:'auto',minWidth:0}}/>
          <span style={{fontSize:'11px',color:'#A3886E',whiteSpace:'nowrap',flexShrink:0}}>{bottleCount} {bottleCount===1?'bottle':'bottles'}</span>
          {!loc.system && (confirmDel ? <Btn onClick={onDelete} variant="danger" style={{flexShrink:0,whiteSpace:'nowrap'}}>Confirm</Btn> : <Btn onClick={()=>setConfirmDel(true)} style={{flexShrink:0}}>Delete</Btn>)}
        </div>
        <div style={{padding:'12px 14px'}}>
          <div style={{marginBottom:'14px',paddingBottom:'12px',borderBottom:'1px solid #160E08'}}>
            <div style={{fontSize:'9px',color:'#A3886E',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:'6px'}}>Positions per row <span style={{color:'#94816A',textTransform:'none'}}>(optional — for numbered racks)</span></div>
            <input type="number" value={positions} min="1" max="50" placeholder="e.g. 12"
              onChange={e=>setPositions(e.target.value)}
              onBlur={()=>onUpdate({...loc, positionsPerRow:positions!==''?+positions:null})}
              style={{maxWidth:'160px'}}/>
          </div>
          <div style={{fontSize:'9px',color:'#A3886E',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:'9px'}}>Rows / Shelves</div>
          {slots.map((slot,i) => (
            <div key={i} style={{display:'flex',alignItems:'center',gap:'6px',marginBottom:'7px'}}>
              <div style={{display:'flex',flexDirection:'column',gap:'2px',flexShrink:0}}>
                <button onClick={()=>i>0&&moveSlot(i,-1)} disabled={i===0}
                  style={{background:'none',border:'1px solid #2A1E16',color:i===0?'#2A1E16':'#A3886E',width:'22px',height:'14px',borderRadius:'3px',fontSize:'9px',lineHeight:1,padding:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
                  ▲
                </button>
                <button onClick={()=>i<slots.length-1&&moveSlot(i,1)} disabled={i===slots.length-1}
                  style={{background:'none',border:'1px solid #2A1E16',color:i===slots.length-1?'#2A1E16':'#A3886E',width:'22px',height:'14px',borderRadius:'3px',fontSize:'9px',lineHeight:1,padding:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
                  ▼
                </button>
              </div>
              <input value={slot} onChange={e=>{const s=[...slots];s[i]=e.target.value;setSlots(s);}} onBlur={()=>saveSlot(i)} style={{flex:1,fontSize:'12px',padding:'7px 10px'}}/>
              <button onClick={()=>deleteSlot(i)} style={{background:'none',border:'1px solid #2A1E16',color:'#9C856E',width:'28px',height:'30px',borderRadius:'5px',fontSize:'12px',flexShrink:0}}>✕</button>
            </div>
          ))}
          <button onClick={addSlot} style={{marginTop:'4px',background:'none',border:'1px dashed #2A1E16',color:'#9A836C',padding:'7px 14px',borderRadius:'5px',fontSize:'11px',width:'100%'}}>+ Add row / shelf</button>
        </div>
      </div>);
    }

    // ─── Add / Edit Drink ──────────────────────────────────────────────────
    const EMPTY_FORM = {
      type:'wine', name:'', producer:'', year:'', isNV:false, price:'',
      wineColor:'red', grape:'', region:'', appellation:'',
      whiskyStyle:'bourbon', whiskyRegion:'', ageStatement:'', isNAS:false, abv:'', caskType:'', mashBill:'',
      rating:null, review:'', reviewDate:'',
      expertRating:null, expertSource:'',
      tastingNotes:{ nose:'', palate:'', finish:'' },
      // Stock (only for new drinks)
      addToStock:true, location:'wine-fridge', sublocation:'Top Shelf', position:null, quantity:1,
    };

    // "Look up details": asks the Worker for suggestions and fills EMPTY fields only. Nothing is overwritten and nothing is saved
    // until the person saves the drink. Facts only (no ratings, prices or tasting notes).
    const LOOKUP_LABELS = { wineColor:'colour', grape:'grape', region:'region', appellation:'appellation', whiskyStyle:'style', whiskyRegion:'region' };
    function LookupBar({ form, setForm, isNew }) {
      const [state, setState] = useState({ phase:'idle', text:'' });
      const can = String(form.name||'').trim().length > 1 && state.phase !== 'busy';
      async function run() {
        const keys = form.type === 'wine' ? ['wineColor','grape','region','appellation'] : ['whiskyStyle','whiskyRegion'];
        if (!keys.some(k => !form[k] || (isNew && (k === 'wineColor' || k === 'whiskyStyle') && form[k] === EMPTY_FORM[k]))) {
          setState({ phase:'done', text:'Nothing to look up: those fields are already filled in.' });
          return;
        }
        setState({ phase:'busy', text:'' });
        try {
          const r = await api('POST', '/lookup', { type: form.type, name: String(form.name).trim(), producer: String(form.producer||'').trim() });
          const s = (r && r.suggestions) || {};
          const filled = [];
          setForm(f => {
            const u = { ...f };
            // Colour and style start on a default (red, bourbon), so on a NEW drink a value still equal to the default counts as unset.
            const unset = k => !u[k] || (isNew && (k === 'wineColor' || k === 'whiskyStyle') && u[k] === EMPTY_FORM[k]);
            for (const k of Object.keys(LOOKUP_LABELS)) if (s[k] && unset(k)) { u[k] = s[k]; filled.push(LOOKUP_LABELS[k]); }
            return u;
          });
          setTimeout(() => setState({ phase:'done', text: filled.length ? 'Suggested: ' + filled.join(', ') + '. Check before saving.' : 'Nothing to add: no confident suggestion, or those fields are already filled.' }), 0);
        } catch (e) {
          setState({ phase:'error', text: e instanceof ApiError ? e.message : 'Look up failed. Please try again.' });
        }
      }
      return (
        <div style={{display:'flex',alignItems:'center',gap:'12px',flexWrap:'wrap'}}>
          <button type="button" onClick={run} disabled={!can}
            style={{padding:'7px 14px',borderRadius:'6px',fontSize:'12px',border:'1px solid #C8922A',background:'#1C1208',color:'#C8922A',opacity:can?1:0.4}}>
            {state.phase==='busy' ? 'Looking up...' : 'Look up details'}
          </button>
          <span style={{fontSize:'12px',color:state.phase==='error'?'#C0604A':'#A88C71'}}>
            {state.phase==='idle' ? 'Fills empty fields only (and a colour or style you have not changed). Suggestions can be wrong, so check them.' : state.text}
          </span>
        </div>
      );
    }

    function AddEditView({ drink, onSave, onCancel }) {
      const locations = useLocations();
      const scale = useRatingScale();
      const isEdit = !!drink?.id;
      const [form, setForm] = useState(() => {
        const base = { ...EMPTY_FORM, ...drink, tastingNotes:{nose:'',palate:'',finish:'',...(drink?.tastingNotes||{})} };
        // Default location to wine-fridge or whiskey-globe based on type
        if (!isEdit) {
          const defId = (drink?.type||'wine')==='wine' ? 'wine-fridge' : 'whisky-globe';
          base.location    = locations.find(l=>l.id===defId) ? defId : (locations[0]?.id||'');
          base.sublocation = locations.find(l=>l.id===base.location)?.slots[0] || '';
        }
        return base;
      });
      const [tab, setTab] = useState('details');

      function set(key, val) {
        setForm(f => {
          const u = {...f, [key]:val};
          if (key==='type' && !isEdit) {
            const defId = val==='wine' ? 'wine-fridge' : 'whisky-globe';
            u.location    = locations.find(l=>l.id===defId) ? defId : (locations[0]?.id||'');
            u.sublocation = locations.find(l=>l.id===u.location)?.slots[0] || '';
            u.position    = null;
          }
          if (key==='location') { u.sublocation=locations.find(l=>l.id===val)?.slots[0]||''; u.position=null; }
          if (key==='sublocation') { u.position=null; }
          return u;
        });
      }
      function setNote(k, v) { setForm(f => ({...f, tastingNotes:{...f.tastingNotes,[k]:v}})); }
      function save() {
        if (!form.name.trim()) { alert('Please enter a name.'); return; }
        if (form.addToStock && !isEdit) {
          const addLoc = locations.find(l => l.id === form.location);
          if (addLoc?.positionsPerRow && !form.position) {
            alert('This rack tracks individual positions — please select a position before adding.');
            return;
          }

        const drinkData = {
          ...(isEdit ? drink : {}),
          id: drink?.id || uid(),
          type:form.type, name:form.name.trim(), producer:form.producer,
          year:form.year?+form.year:null, isNV:!!form.isNV, price:form.price?+form.price:null,
          wineColor:form.wineColor, grape:form.grape, region:form.region, appellation:form.appellation,
          whiskyStyle:form.whiskyStyle, whiskyRegion:form.whiskyRegion,
          ageStatement:form.ageStatement?+form.ageStatement:null, isNAS:!!form.isNAS,
          abv:form.abv?+form.abv:null, caskType:form.caskType, mashBill:form.mashBill,
          rating:form.rating, review:form.review, reviewDate:form.reviewDate,
          expertRating:form.expertRating!=null?+form.expertRating:null, expertSource:form.expertSource||'',
          tastingNotes:form.tastingNotes,
          stock: isEdit ? (drink.stock||[]) : (form.addToStock ? [{
            id:uid(), location:form.location, sublocation:form.sublocation,
            position:form.position?+form.position:null,
            quantity:Math.max(1,+form.quantity||1),
            dateAdded:today(), status:'in_stock', dateFinished:null,

        </div>
        <div style={{padding:'18px 18px 60px',maxWidth:'600px'}}>
          <div style={{display:'flex',gap:'8px',marginBottom:'18px',alignItems:'center'}}>

                <button key={v} onClick={()=>set('type',v)} style={{padding:'9px 18px',borderRadius:'7px',border:form.type===v?'1px solid #C8922A':'1px solid #1E1610',background:form.type===v?'#1C1208':'transparent',color:form.type===v?'#C8922A':'#9C856E',fontSize:'13px',fontWeight:form.type===v?'600':'400'}}>{l}</button>

              <FField label="Price ($)"><input type="number" value={form.price} onChange={e=>set('price',e.target.value)} placeholder="Per bottle" min="0"/></FField>
            </FRow>

            {form.type==='wine' && (<Box accentColor="#8B1A35" title="🍷 Wine Details">
              <FField label="Colour"><div style={{display:'flex',gap:'5px',flexWrap:'wrap',marginBottom:'12px'}}>{WINE_COLORS.map(c=><TypeTag key={c} active={form.wineColor===c} color={BOTTLE_COLORS.wine[c]} onClick={()=>set('wineColor',c)}>{c}</TypeTag>)}</div></FField>
              <div style={{display:'flex',flexDirection:'column',gap:'11px',marginTop:'10px'}}>

            {form.type==='whisky' && (<Box accentColor="#C07A2A" title="🥃 Whisky Details">
              <FField label="Style"><div style={{display:'flex',gap:'5px',flexWrap:'wrap',marginBottom:'12px'}}>{WHISKY_STYLES.map(s=><TypeTag key={s} active={form.whiskyStyle===s} color="#C07A2A" onClick={()=>set('whiskyStyle',s)}>{s}</TypeTag>)}</div></FField>
              <div style={{display:'flex',flexDirection:'column',gap:'11px',marginTop:'10px'}}>
                <FRow>
                  <FField label="Region"><input value={form.whiskyRegion} onChange={e=>set('whiskyRegion',e.target.value)} placeholder="e.g. Speyside, Scotland"/></FField>
                  <FField label="Age Statement">
                    <div style={{display:'flex',gap:'8px',alignItems:'center'}}>
                      {!form.isNAS && <input type="number" value={form.ageStatement} onChange={e=>set('ageStatement',e.target.value)} placeholder="Years" min="0" style={{flex:1}}/>}
                      {form.isNAS && <span style={{flex:1,fontSize:'13px',color:'#C8922A',fontWeight:'600'}}>NAS</span>}
                      <button onClick={()=>{set('isNAS',!form.isNAS);if(!form.isNAS)set('ageStatement','');}}
                        style={{padding:'7px 12px',borderRadius:'6px',fontSize:'11px',whiteSpace:'nowrap',border:form.isNAS?'1px solid #C8922A':'1px solid #2A1E16',background:form.isNAS?'#1C1208':'transparent',color:form.isNAS?'#C8922A':'#9E8771'}}>
                        NAS
                      </button>
                    </div>
                  </FField>
                </FRow>
                <FRow><FField label="ABV (%)"><input type="number" value={form.abv} onChange={e=>set('abv',e.target.value)} placeholder="e.g. 46.5" step="0.1" min="0" max="100"/></FField><FField label="Cask Type"><input value={form.caskType} onChange={e=>set('caskType',e.target.value)} placeholder="e.g. Ex-Sherry Oak"/></FField></FRow>
                <FField label="Mash Bill"><input value={form.mashBill} onChange={e=>set('mashBill',e.target.value)} placeholder="e.g. Corn, Rye, Malted Barley"/></FField>
              </div>
            </Box>)}

            {/* Stock — only shown when adding, not editing (stock managed from detail view) */}
            {!isEdit && (<Box title="📍 In Your Cellar?" style={{marginTop:'2px'}}>
              <div style={{display:'flex',alignItems:'center',gap:'12px',marginBottom: form.addToStock?'14px':'0'}}>
                <button onClick={()=>set('addToStock',!form.addToStock)}
                  style={{width:'36px',height:'20px',borderRadius:'10px',border:'none',background:form.addToStock?'#C8922A':'#2A1E16',position:'relative',flexShrink:0,transition:'background 0.2s'}}>

          {tab==='review' && (<div style={{display:'flex',flexDirection:'column',gap:'13px'}}>

              <div style={{display:'flex',alignItems:'center',gap:'18px'}}>

                  onChange={e=>{ const v=e.target.value; set('rating', v===''?null:Math.min(100,Math.max(0,+v))); }}
                  style={{fontFamily:"'Playfair Display', serif",fontSize:'46px',fontWeight:'700',color:'#C8922A',lineHeight:'1',width:'76px',textAlign:'center',background:'transparent',border:'none',outline:'none',padding:0,MozAppearance:'textfield'}}/>

                      ))}

                <div style={{flex:1}}>
                  {form.expertRating!=null ? (<>
                    <input type="range" min="0" max="100" value={form.expertRating} onChange={e=>set('expertRating',+e.target.value)} style={{width:'100%',accentColor:'#7090B8'}}/>
